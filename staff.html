<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NextTurn | Staff Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: #f5f5f5;
    min-height: 100vh;
}

header {
    background: #080808;
    border-bottom: 1px solid rgba(212,175,55,0.25);
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #d4af37;
    font-size: 26px;
    font-weight: 800;
}

.staff-label {
    color: #9a9a9a;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 60px;
}

.page-title {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9a9a9a;
    margin-bottom: 25px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab-btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-weight: 700;
}

.tab-btn.active {
    background: linear-gradient(
        135deg,
        #d4af37,
        #f4d77d
    );
    color: #080808;
    border-color: #d4af37;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.card {
    background: #111;
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
}

.card-title {
    color: #f4d77d;
    font-size: 20px;
    margin-bottom: 5px;
}

.card-subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 18px;
}

.order-card {
    background: #111;
    border: 1px solid #242424;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 15px;
}

.order-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.order-id {
    color: #f4d77d;
    font-weight: 800;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    background: #191919;
    color: #f4d77d;
    font-size: 12px;
}

.order-info {
    color: #aaa;
    line-height: 1.7;
    font-size: 14px;
    margin-bottom: 15px;
}

.order-items {
    color: #ddd;
    margin-bottom: 15px;
    line-height: 1.7;
}

.action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.action-btn {
    padding: 10px 15px;
    border-radius: 9px;
    border: 1px solid #333;
    background: #181818;
    color: #ddd;
    cursor: pointer;
    font-weight: 700;
}

.action-btn:hover {
    border-color: #d4af37;
    color: #f4d77d;
}

.action-btn.primary {
    background: linear-gradient(
        135deg,
        #d4af37,
        #f4d77d
    );
    color: #080808;
    border-color: #d4af37;
}

.action-btn.danger {
    color: #ff9a9a;
}

.action-btn.success {
    color: #9affb0;
}

.menu-grid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );
    gap: 16px;
}

.food-card {
    background: #111;
    border: 1px solid #242424;
    border-radius: 15px;
    padding: 18px;
}

.food-name {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 5px;
}

.food-category {
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.food-price {
    color: #f4d77d;
    font-weight: 800;
    font-size: 18px;
    margin-bottom: 15px;
}

.flavor-group {
    background: #0d0d0d;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
}

.flavor-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
}

.flavor-group-name {
    color: #f4d77d;
    font-size: 21px;
    font-weight: 800;
}

.flavor-count {
    color: #888;
    font-size: 12px;
}

.flavor-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-top: 1px solid #222;
}

.flavor-info {
    min-width: 0;
}

.flavor-name {
    font-size: 15px;
    font-weight: 700;
}

.flavor-price {
    color: #888;
    font-size: 13px;
    margin-top: 4px;
}

.availability {
    font-size: 12px;
    margin-top: 5px;
    font-weight: 700;
}

.available {
    color: #8cffaa;
}

.unavailable {
    color: #ff8c8c;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #777;
}

.loading {
    text-align: center;
    padding: 35px;
    color: #888;
}

@media (max-width: 600px) {

    header {
        padding: 15px;
    }

    .container {
        padding: 22px 14px 45px;
    }

    .page-title {
        font-size: 27px;
    }

    .tabs {
        width: 100%;
    }

    .tab-btn {
        flex: 1;
        padding: 11px 10px;
    }

    .order-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .flavor-row {
        align-items: flex-start;
        flex-direction: column;
    }

    .flavor-row .action-btn {
        width: 100%;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            NextTurn
        </div>

        <div class="staff-label">
            Staff Dashboard
        </div>

    </div>

</header>

<div class="container">

    <h1 class="page-title">
        Staff Dashboard
    </h1>

    <p class="subtitle">
        Manage orders and canteen menu availability
    </p>

    <div class="tabs">

        <button
            id="ordersTab"
            class="tab-btn active"
            onclick="showSection('orders')"
        >
            Orders
        </button>

        <button
            id="menuTab"
            class="tab-btn"
            onclick="showSection('menu')"
        >
            Menu
        </button>

    </div>

    <section
        id="ordersSection"
        class="section active"
    >

        <div class="card">

            <div class="card-title">
                Orders
            </div>

            <div class="card-subtitle">
                Verify payments and manage order status
            </div>

            <div id="ordersContainer">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </section>

    <section
        id="menuSection"
        class="section"
    >

        <div class="card">

            <div class="card-title">
                Menu Management
            </div>

            <div class="card-subtitle">
                Control food and individual flavor availability
            </div>

            <div id="foodContainer">

                <div class="loading">
                    Loading menu...
                </div>

            </div>

        </div>

    </section>

</div>

<script>

const API =
    "https://nextturn-mgbf.onrender.com";

let foodItems = [];

let orders = [];


/* =========================
   TAB SWITCHING
========================= */

function showSection(section) {

    const ordersSection =
        document.getElementById(
            "ordersSection"
        );

    const menuSection =
        document.getElementById(
            "menuSection"
        );

    const ordersTab =
        document.getElementById(
            "ordersTab"
        );

    const menuTab =
        document.getElementById(
            "menuTab"
        );

    if (section === "orders") {

        ordersSection.classList.add("active");

        menuSection.classList.remove("active");

        ordersTab.classList.add("active");

        menuTab.classList.remove("active");

    } else {

        ordersSection.classList.remove("active");

        menuSection.classList.add("active");

        ordersTab.classList.remove("active");

        menuTab.classList.add("active");

    }

}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    try {

        const response =
            await fetch(
                `${API}/api/staff/orders?t=${Date.now()}`
            );

        if (!response.ok) {
            throw new Error(
                "Failed to load orders"
            );
        }

        orders =
            await response.json();

        renderOrders();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load orders
            </div>
        `;

    }

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );

    if (!orders.length) {

        container.innerHTML = `
            <div class="empty">
                No orders available
            </div>
        `;

        return;
    }

    container.innerHTML =
        orders.map(order => {

            const paymentVerified =
                String(
                    order.paymentStatus || ""
                )
                .toLowerCase()
                .includes("verified");

            const token =
                order.tokenNumber;

            let itemsText =
                "No items";

            if (
                Array.isArray(
                    order.foodItems
                )
            ) {

                itemsText =
                    order.foodItems
                        .map(item => {

                            if (
                                typeof item ===
                                "object"
                            ) {

                                const name =
                                    item.name || "";

                                const flavor =
                                    item.flavor || "";

                                const quantity =
                                    item.quantity || 1;

                                return flavor
                                    ? `${name} - ${flavor} × ${quantity}`
                                    : `${name} × ${quantity}`;
                            }

                            return String(item);

                        })
                        .join("<br>");

            } else if (
                typeof order.foodItems ===
                "string"
            ) {

                itemsText =
                    order.foodItems;

            }

            return `
                <div class="order-card">

                    <div class="order-header">

                        <div class="order-id">
                            Order #${order.id}
                        </div>

                        <div class="status">
                            ${
                                order.orderStatus ||
                                "Unknown"
                            }
                        </div>

                    </div>

                    <div class="order-info">

                        <strong>
                            Student:
                        </strong>
                        ${order.studentName || "N/A"}

                        <br>

                        <strong>
                            Student ID:
                        </strong>
                        ${order.studentId || "N/A"}

                        <br>

                        <strong>
                            Email:
                        </strong>
                        ${order.studentEmail || "N/A"}

                        <br>

                        <strong>
                            Payment:
                        </strong>
                        ${
                            order.paymentStatus ||
                            "Pending"
                        }

                        <br>

                        <strong>
                            Token:
                        </strong>
                        ${
                            token ||
                            "Not Generated"
                        }

                        <br>

                        <strong>
                            Total:
                        </strong>
                        ₹${Number(
                            order.totalAmount || 0
                        ).toFixed(2)}

                    </div>

                    <div class="order-items">

                        <strong>
                            Items:
                        </strong>

                        <br>

                        ${itemsText}

                    </div>

                    <div class="action-row">

                        ${
                            !paymentVerified
                            ? `
                                <button
                                    class="action-btn primary"
                                    onclick="verifyPayment(${order.id})"
                                >
                                    Verify Payment
                                </button>
                              `
                            : ""
                        }

                        ${
                            paymentVerified &&
                            (!token ||
                             token ===
                             "Not Generated")
                            ? `
                                <button
                                    class="action-btn primary"
                                    onclick="generateToken(${order.id})"
                                >
                                    Generate Token
                                </button>
                              `
                            : ""
                        }

                        ${
                            paymentVerified &&
                            token &&
                            token !==
                            "Not Generated" &&
                            String(
                                order.orderStatus || ""
                            )
                            .toLowerCase()
                            .includes("payment")
                            ? `
                                <button
                                    class="action-btn"
                                    onclick="markPreparing(${order.id})"
                                >
                                    Start Preparing
                                </button>
                              `
                            : ""
                        }

                        ${
                            String(
                                order.orderStatus || ""
                            )
                            .toLowerCase()
                            .includes("preparing")
                            ? `
                                <button
                                    class="action-btn success"
                                    onclick="markReady(${order.id})"
                                >
                                    Mark Ready
                                </button>
                              `
                            : ""
                        }

                        ${
                            String(
                                order.orderStatus || ""
                            )
                            .toLowerCase()
                            .includes("ready")
                            ? `
                                <button
                                    class="action-btn primary"
                                    onclick="completeOrder(${order.id})"
                                >
                                    Complete Order
                                </button>
                              `
                            : ""
                        }

                    </div>

                </div>
            `;

        }).join("");

}
/* =========================
   ORDER ACTIONS
========================= */

async function verifyPayment(id) {

    await updateOrder(
        `/api/staff/payments/${id}/verify`
    );

}


async function generateToken(id) {

    await updateOrder(
        `/api/staff/tokens/${id}/generate`
    );

}


async function markPreparing(id) {

    await updateOrder(
        `/api/staff/orders/${id}/preparing`
    );

}


async function markReady(id) {

    await updateOrder(
        `/api/staff/ready/${id}`
    );

}


async function completeOrder(id) {

    await updateOrder(
        `/api/staff/orders/${id}/complete`
    );

}


async function updateOrder(endpoint) {

    try {

        const response =
            await fetch(
                `${API}${endpoint}`,
                {
                    method: "PUT"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Order update failed"
            );

        }

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to update order."
        );

    }

}


/* =========================
   LOAD FOOD
========================= */

async function loadFood() {

    const container =
        document.getElementById(
            "foodContainer"
        );

    try {

        const response =
            await fetch(
                `${API}/api/staff/food?t=${Date.now()}`
            );

        if (!response.ok) {

            throw new Error(
                "Failed to load menu"
            );

        }

        foodItems =
            await response.json();

        renderFood();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load menu
            </div>
        `;

    }

}


/* =========================
   RENDER FOOD
========================= */

function renderFood() {

    const container =
        document.getElementById(
            "foodContainer"
        );

    if (!foodItems.length) {

        container.innerHTML = `
            <div class="empty">
                No food items found
            </div>
        `;

        return;
    }


    const flavorFoods = [
        "Chips",
        "Kurkure"
    ];


    const flavorGroups = {};

    const normalFoods = [];


    foodItems.forEach(item => {

        if (
            flavorFoods.includes(item.name) &&
            item.flavor
        ) {

            if (!flavorGroups[item.name]) {

                flavorGroups[item.name] = [];

            }

            flavorGroups[item.name].push(item);

        } else {

            normalFoods.push(item);

        }

    });


    let html = `
        <div class="menu-grid">
    `;


    /* =========================
       FLAVOR GROUPS
    ========================= */

    Object.keys(flavorGroups).forEach(
        foodName => {

            const flavors =
                flavorGroups[foodName];


            const availableCount =
                flavors.filter(
                    item => item.available
                ).length;


            html += `

                <div class="flavor-group">

                    <div class="flavor-group-header">

                        <div>

                            <div class="flavor-group-name">
                                ${foodName}
                            </div>

                            <div class="flavor-count">
                                ${availableCount}
                                of
                                ${flavors.length}
                                flavors available
                            </div>

                        </div>

                    </div>


                    ${flavors.map(item => `

                        <div class="flavor-row">

                            <div class="flavor-info">

                                <div class="flavor-name">
                                    ${item.flavor}
                                </div>

                                <div class="flavor-price">
                                    ₹${Number(
                                        item.price
                                    ).toFixed(2)}
                                </div>

                                <div class="
                                    availability
                                    ${
                                        item.available
                                            ? "available"
                                            : "unavailable"
                                    }
                                ">

                                    ${
                                        item.available
                                            ? "● Available"
                                            : "● Unavailable"
                                    }

                                </div>

                            </div>


                            <button
                                class="action-btn
                                ${
                                    item.available
                                        ? "danger"
                                        : "success"
                                }"
                                onclick="${
                                    item.available
                                        ? `makeFlavorUnavailable(${item.id})`
                                        : `makeFlavorAvailable(${item.id})`
                                }"
                            >

                                ${
                                    item.available
                                        ? "Make Unavailable"
                                        : "Make Available"
                                }

                            </button>

                        </div>

                    `).join("")}

                </div>

            `;

        }
    );


    html += `
        </div>

        <h3
            style="
                color:#f4d77d;
                margin:28px 0 16px;
            "
        >
            Other Food Items
        </h3>

        <div class="menu-grid">
    `;


    /* =========================
       NORMAL FOOD ITEMS
    ========================= */

    normalFoods.forEach(item => {

        html += `

            <div class="food-card">

                <div class="food-name">
                    ${item.name}
                </div>

                <div class="food-category">
                    ${item.category || "Food"}
                </div>

                <div class="food-price">
                    ₹${Number(
                        item.price
                    ).toFixed(2)}
                </div>

                <div
                    class="
                        availability
                        ${
                            item.available
                                ? "available"
                                : "unavailable"
                        }
                    "
                    style="margin-bottom:14px;"
                >

                    ${
                        item.available
                            ? "● Available"
                            : "● Unavailable"
                    }

                </div>

                <button
                    class="
                        action-btn
                        ${
                            item.available
                                ? "danger"
                                : "success"
                        }
                    "
                    onclick="${
                        item.available
                            ? `makeUnavailable(${item.id})`
                            : `makeAvailable(${item.id})`
                    }"
                >

                    ${
                        item.available
                            ? "Make Unavailable"
                            : "Make Available"
                    }

                </button>

            </div>

        `;

    });


    html += `
        </div>
    `;


    container.innerHTML = html;
    }
    /* =========================
   NORMAL FOOD AVAILABILITY
========================= */

async function makeUnavailable(id) {

    try {

        const response =
            await fetch(
                `${API}/api/staff/food/${id}/unavailable`,
                {
                    method: "PUT"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to update availability"
            );

        }

        await loadFood();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to make food unavailable."
        );

    }

}


async function makeAvailable(id) {

    try {

        const response =
            await fetch(
                `${API}/api/staff/food/${id}/available`,
                {
                    method: "PUT"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to update availability"
            );

        }

        await loadFood();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to make food available."
        );

    }

}


/* =========================
   FLAVOR AVAILABILITY
========================= */

async function makeFlavorUnavailable(id) {

    try {

        const response =
            await fetch(
                `${API}/api/staff/food/${id}/flavor/unavailable`,
                {
                    method: "PUT"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to update flavor"
            );

        }

        await loadFood();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to make flavor unavailable."
        );

    }

}


async function makeFlavorAvailable(id) {

    try {

        const response =
            await fetch(
                `${API}/api/staff/food/${id}/flavor/available`,
                {
                    method: "PUT"
                }
            );

        if (!response.ok) {

            throw new Error(
                "Failed to update flavor"
            );

        }

        await loadFood();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to make flavor available."
        );

    }

}


/* =========================
   INITIAL LOAD
========================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadOrders();

        loadFood();

    }
);


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    () => {

        loadOrders();

    },
    10000
);


setInterval(
    () => {

        loadFood();

    },
    10000
);


</script>

</body>

</html>
