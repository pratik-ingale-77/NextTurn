<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextTurn - Staff Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #082b5c;
            color: white;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 23px;
        }

        header span {
            font-size: 13px;
            opacity: 0.85;
        }

        .logout {
            background: #e53935;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }

        .stat {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            text-align: center;
        }

        .stat h2 {
            color: #082b5c;
            font-size: 25px;
            margin-bottom: 5px;
        }

        .stat p {
            font-size: 13px;
            color: #666;
        }

        /* TABS */

        .section-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            max-width: 220px;
            padding: 14px 20px;
            border: 2px solid #d7e0ec;
            background: white;
            color: #082b5c;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-button:hover {
            background: #eef5ff;
        }

        .tab-button.active {
            background: #082b5c;
            color: white;
            border-color: #082b5c;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* SECTION HEADER */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .section-header h2 {
            color: #082b5c;
            font-size: 22px;
        }

        .refresh-btn {
            background: #eef5ff;
            color: #082b5c;
            border: 1px solid #c9d9ee;
            padding: 8px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* ORDERS */

        .orders-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            border-left: 5px solid #082b5c;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 12px;
        }

        .order-top h3 {
            color: #082b5c;
            margin-bottom: 4px;
        }

        .order-id {
            font-size: 13px;
            color: #777;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-payment {
            background: #fff3cd;
            color: #856404;
        }

        .status-preparing {
            background: #e3f2fd;
            color: #1565c0;
        }

        .status-ready {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status-completed {
            background: #eeeeee;
            color: #555;
        }

        .order-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 12px 0;
        }

        .detail {
            background: #f7f9fc;
            padding: 10px;
            border-radius: 8px;
        }

        .detail small {
            display: block;
            color: #777;
            margin-bottom: 3px;
        }

        .detail strong {
            font-size: 14px;
        }

        .food-list {
            background: #f7f9fc;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            font-size: 14px;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        button.action {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .verify {
            background: #1565c0;
            color: white;
        }

        .token {
            background: #6a1b9a;
            color: white;
        }

        .ready {
            background: #2e7d32;
            color: white;
        }

        .complete {
            background: #455a64;
            color: white;
        }

        button.action:disabled {
            background: #cfd5dc;
            color: #777;
            cursor: not-allowed;
        }

        .token-display {
            background: #fff8e1;
            border: 2px dashed #f0b400;
            padding: 12px;
            text-align: center;
            border-radius: 10px;
            margin-top: 10px;
        }

        .token-display strong {
            font-size: 25px;
            color: #8a6500;
        }

        .ready-message {
            background: #e8f5e9;
            color: #1b5e20;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* MENU */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .food-card {
            background: white;
            border-radius: 14px;
            padding: 17px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .food-card h3 {
            color: #082b5c;
            margin-bottom: 6px;
        }

        .food-category {
            color: #777;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .food-price {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .availability {
            padding: 7px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 12px;
        }

        .available {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .unavailable {
            background: #ffebee;
            color: #c62828;
        }

        .stock-btn {
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .out-btn {
            background: #c62828;
            color: white;
        }

        .in-btn {
            background: #2e7d32;
            color: white;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #777;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .order-details {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 550px) {

            header {
                padding: 15px;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                padding: 14px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 9px;
            }

            .stat {
                padding: 13px 8px;
            }

            .stat h2 {
                font-size: 20px;
            }

            .section-tabs {
                gap: 8px;
            }

            .tab-button {
                max-width: none;
                padding: 12px 8px;
                font-size: 14px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
            }

            .order-actions {
                flex-direction: column;
            }

            button.action {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div>
        <h1>⚡ NextTurn</h1>
        <span>Staff Dashboard • College Canteen</span>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

    <!-- STATS -->

    <div class="stats">

        <div class="stat">
            <h2 id="totalOrders">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="stat">
            <h2 id="pendingPayments">0</h2>
            <p>Pending Payments</p>
        </div>

        <div class="stat">
            <h2 id="preparingOrders">0</h2>
            <p>Preparing</p>
        </div>

        <div class="stat">
            <h2 id="readyOrders">0</h2>
            <p>Ready</p>
        </div>

        <div class="stat">
            <h2 id="completedOrders">0</h2>
            <p>Completed</p>
        </div>

    </div>

    <!-- MAIN TABS -->

    <div class="section-tabs">

        <button
            id="ordersTab"
            class="tab-button active"
            onclick="showSection('orders')">
            📦 Orders
        </button>

        <button
            id="menuTab"
            class="tab-button"
            onclick="showSection('menu')">
            🍔 Menu
        </button>

    </div>

    <!-- ORDERS SECTION -->

    <section id="ordersSection" class="section active">

        <div class="section-header">

            <h2>📦 Incoming Orders</h2>

            <button class="refresh-btn" onclick="refreshOrders()">
                🔄 Refresh
            </button>

        </div>

        <div id="ordersContainer" class="orders-container">
            <div class="loading">
                Loading orders...
            </div>
        </div>

    </section>


    <!-- MENU SECTION -->

    <section id="menuSection" class="section">

        <div class="section-header">

            <h2>🍔 Menu & Stock</h2>

            <button class="refresh-btn" onclick="refreshFood()">
                🔄 Refresh
            </button>

        </div>

        <div id="menuContainer" class="menu-grid">
            <div class="loading">
                Loading menu...
            </div>
        </div>

    </section>

</div>


<script>

const API = "https://nextturn-mgbf.onrender.com";


/* =========================
   SECTION SWITCHING
========================= */

function showSection(section) {

    const ordersSection =
        document.getElementById("ordersSection");

    const menuSection =
        document.getElementById("menuSection");

    const ordersTab =
        document.getElementById("ordersTab");

    const menuTab =
        document.getElementById("menuTab");


    if (section === "orders") {

        ordersSection.classList.add("active");
        menuSection.classList.remove("active");

        ordersTab.classList.add("active");
        menuTab.classList.remove("active");

        refreshOrders();

    } else {

        menuSection.classList.add("active");
        ordersSection.classList.remove("active");

        menuTab.classList.add("active");
        ordersTab.classList.remove("active");

        refreshFood();
    }
}


/* =========================
   LOAD ORDERS
========================= */

async function refreshOrders() {

    const container =
        document.getElementById("ordersContainer");

    container.innerHTML =
        '<div class="loading">Loading orders...</div>';

    try {

        const response = await fetch(
            API + "/api/staff/orders?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const orders = await response.json();

        updateStats(orders);

        if (!orders.length) {

            container.innerHTML =
                '<div class="empty">No orders found.</div>';

            return;
        }

        container.innerHTML =
            orders.map(createOrderCard).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load orders.<br><br>
                Please refresh the page.
            </div>
        `;
    }
}


/* =========================
   CREATE ORDER CARD
========================= */

function createOrderCard(order) {

    const status =
        order.orderStatus || "Unknown";

    let statusClass =
        "status-payment";

    if (status === "Preparing") {
        statusClass = "status-preparing";
    }

    if (status === "Ready") {
        statusClass = "status-ready";
    }

    if (status === "Completed") {
        statusClass = "status-completed";
    }


    let foodText = "Food details unavailable";

    try {

        const items =
            typeof order.foodItems === "string"
                ? JSON.parse(order.foodItems)
                : order.foodItems;

        if (Array.isArray(items)) {

            foodText = items.map(item => {

                return `${item.name || "Food"} × ${item.quantity || 1}`;

            }).join("<br>");
        }

    } catch (e) {

        foodText =
            order.foodItems || "Food details unavailable";
    }


    let buttons = "";


    /* PAYMENT */

    if (order.paymentStatus !== "Verified") {

        buttons += `
            <button
                class="action verify"
                onclick="verifyPayment(${order.id})">
                ✓ Verify Payment
            </button>
        `;

    } else {

        buttons += `
            <button
                class="action verify"
                disabled>
                ✓ Payment Verified
            </button>
        `;
    }


    /* TOKEN */

    if (
        order.paymentStatus === "Verified" &&
        order.tokenNumber == null &&
        status !== "Completed"
    ) {

        buttons += `
            <button
                class="action token"
                onclick="generateToken(${order.id})">
                🎟 Generate Token
            </button>
        `;

    }


    /* READY */

    if (
        status === "Preparing" &&
        order.tokenNumber != null
    ) {

        buttons += `
            <button
                class="action ready"
                onclick="markReady(${order.id})">
                ✓ Mark as Ready
            </button>
        `;
    }


    /* COMPLETED */

    if (status === "Ready") {

        buttons += `
            <button
                class="action complete"
                onclick="markCompleted(${order.id})">
                ✓ Mark Completed
            </button>
        `;
    }


    let tokenHTML = "";

    if (order.tokenNumber != null) {

        tokenHTML = `
            <div class="token-display">
                <div>Token Number</div>
                <strong>#${order.tokenNumber}</strong>
            </div>
        `;
    }


    let readyMessage = "";

    if (status === "Ready") {

        readyMessage = `
            <div class="ready-message">
                🔔 Food is ready — student can collect Token
                #${order.tokenNumber}.
            </div>
        `;
    }


    return `
        <div class="order-card">

            <div class="order-top">

                <div>
                    <h3>
                        ${escapeHTML(
                            order.studentName || "Student"
                        )}
                    </h3>

                    <div class="order-id">
                        Order #${order.id || "-"}
                    </div>
                </div>

                <span class="status ${statusClass}">
                    ${escapeHTML(status)}
                </span>

            </div>


            <div class="order-details">

                <div class="detail">
                    <small>Student ID</small>
                    <strong>
                        ${escapeHTML(
                            order.studentId || "-"
                        )}
                    </strong>
                </div>

                <div class="detail">
                    <small>Payment</small>
                    <strong>
                        ${escapeHTML(
                            order.paymentStatus || "-"
                        )}
                    </strong>
                </div>

                <div class="detail">
                    <small>Total</small>
                    <strong>
                        ₹${Number(
                            order.totalAmount || 0
                        ).toFixed(2)}
                    </strong>
                </div>

            </div>


            <div class="food-list">
                <strong>🍴 Order:</strong><br><br>
                ${foodText}
            </div>


            ${tokenHTML}

            ${readyMessage}


            <div class="order-actions">
                ${buttons}
            </div>

        </div>
    `;
}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment(id) {

    if (!confirm("Verify payment for this order?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/payments/${id}/verify`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Payment verification failed");
        }

        alert("Payment verified successfully.");

        refreshOrders();

    } catch (error) {

        console.error(error);

        alert("Unable to verify payment.");
    }
}


/* =========================
   GENERATE TOKEN
========================= */

async function generateToken(id) {

    if (!confirm("Generate token for this order?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/tokens/${id}/generate`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Token generation failed");
        }

        const order =
            await response.json();

        alert(
            "Token generated: #" +
            order.tokenNumber
        );

        refreshOrders();

    } catch (error) {

        console.error(error);

        alert("Unable to generate token.");
    }
}


/* =========================
   MARK READY
========================= */

async function markReady(id) {

    if (!confirm("Mark this food as READY?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/ready/${id}`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Ready update failed");
        }

        alert(
            "Order marked as Ready.\n" +
            "Student will see the ready notification."
        );

        refreshOrders();

    } catch (error) {

        console.error(error);

        alert("Unable to mark order as ready.");
    }
}


/* =========================
   MARK COMPLETED
========================= */

async function markCompleted(id) {

    if (!confirm("Mark this order as completed?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/orders/${id}/complete`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Completion failed");
        }

        alert("Order completed successfully.");

        refreshOrders();

    } catch (error) {

        console.error(error);

        alert("Unable to complete order.");
    }
}


/* =========================
   STATS
========================= */

function updateStats(orders) {

    document.getElementById("totalOrders")
        .textContent = orders.length;


    const pending =
        orders.filter(
            o => o.paymentStatus === "Pending Verification"
        ).length;

    const preparing =
        orders.filter(
            o => o.orderStatus === "Preparing"
        ).length;

    const ready =
        orders.filter(
            o => o.orderStatus === "Ready"
        ).length;

    const completed =
        orders.filter(
            o => o.orderStatus === "Completed"
        ).length;


    document.getElementById("pendingPayments")
        .textContent = pending;

    document.getElementById("preparingOrders")
        .textContent = preparing;

    document.getElementById("readyOrders")
        .textContent = ready;

    document.getElementById("completedOrders")
        .textContent = completed;
}


/* =========================
   LOAD MENU
========================= */

async function refreshFood() {

    const container =
        document.getElementById("menuContainer");

    container.innerHTML =
        '<div class="loading">Loading menu...</div>';

    try {

        const response = await fetch(
            API + "/api/staff/food?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to load menu");
        }

        const foods =
            await response.json();


        if (!foods.length) {

            container.innerHTML =
                '<div class="empty">No menu items found.</div>';

            return;
        }


        container.innerHTML =
            foods.map(createFoodCard).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load menu.<br><br>
                Please refresh the page.
            </div>
        `;
    }
}


/* =========================
   FOOD CARD
========================= */

function createFoodCard(food) {

    const available =
        food.available === true;


    return `
        <div class="food-card">

            <h3>
                ${escapeHTML(
                    food.name || "Food Item"
                )}
            </h3>

            <div class="food-category">
                ${escapeHTML(
                    food.category || "Menu"
                )}
            </div>

            <div class="food-price">
                ₹${Number(
                    food.price || 0
                ).toFixed(2)}
            </div>


            <span class="availability ${
                available
                    ? "available"
                    : "unavailable"
            }">

                ${
                    available
                        ? "✓ Available"
                        : "✕ Out of Stock"
                }

            </span>


            ${
                available

                ? `
                    <button
                        class="stock-btn out-btn"
                        onclick="markOutOfStock(${food.id})">
                        Mark Out of Stock
                    </button>
                  `

                : `
                    <button
                        class="stock-btn in-btn"
                        onclick="markAvailable(${food.id})">
                        Mark Available
                    </button>
                  `
            }

        </div>
    `;
}


/* =========================
   MARK OUT OF STOCK
========================= */

async function markOutOfStock(id) {

    try {

        const response = await fetch(
            `${API}/api/staff/food/${id}/unavailable`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        refreshFood();

    } catch (error) {

        console.error(error);

        alert("Unable to update food availability.");
    }
}


/* =========================
   MARK AVAILABLE
========================= */

async function markAvailable(id) {

    try {

        const response = await fetch(
            `${API}/api/staff/food/${id}/available`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        refreshFood();

    } catch (error) {

        console.error(error);

        alert("Unable to update food availability.");
    }
}


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("nextTurnStaff");

    window.location.href = "login.html";
}


/* =========================
   INITIAL LOAD
========================= */

refreshOrders();


/*
   Automatically refresh orders every 5 seconds
   so staff can see new student orders.
*/

setInterval(() => {

    if (
        document
            .getElementById("ordersSection")
            .classList.contains("active")
    ) {
        refreshOrders();
    }

}, 5000);

</script>

</body>
</html>
