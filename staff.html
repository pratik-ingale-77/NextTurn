 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NextTurn - Staff Dashboard</title>

<link rel="stylesheet" href="styles.css">

<style>
* {
    box-sizing: border-box;
}

body {
    background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 35%),
        #080808;
    color: #f5f5f5;
    min-height: 100vh;
}

.staff-header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 17px 24px;
    background: rgba(8,8,8,.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(212,175,55,.18);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    color: #D4AF37;
    font-size: 25px;
    font-weight: 900;
}

.header-subtitle {
    color: #777;
    font-size: 12px;
    margin-top: 3px;
}

.logout {
    border: 1px solid rgba(212,175,55,.35);
    background: transparent;
    color: #D4AF37;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.logout:hover {
    background: rgba(212,175,55,.1);
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 28px 20px 60px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 13px;
    margin-bottom: 25px;
}

.stat {
    background: linear-gradient(145deg,#151515,#0e0e0e);
    border: 1px solid rgba(212,175,55,.18);
    border-radius: 17px;
    padding: 18px 12px;
    text-align: center;
}

.stat h2 {
    color: #D4AF37;
    font-size: 27px;
    margin-bottom: 6px;
}

.stat p {
    color: #858585;
    font-size: 12px;
}

.section-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-button {
    border: 1px solid #292929;
    background: #101010;
    color: #999;
    padding: 13px 25px;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
}

.tab-button:hover {
    color: #F4D77D;
    border-color: rgba(212,175,55,.4);
}

.tab-button.active {
    background: linear-gradient(135deg,#D4AF37,#F4D77D);
    color: #090909;
    border-color: #D4AF37;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 16px;
}

.section-header h2 {
    font-size: 22px;
    color: #F5F5F5;
}

.refresh-btn {
    background: #111;
    border: 1px solid rgba(212,175,55,.3);
    color: #D4AF37;
    padding: 9px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
}

.orders-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.order-card {
    background: linear-gradient(145deg,#151515,#0d0d0d);
    border: 1px solid rgba(212,175,55,.18);
    border-left: 4px solid #D4AF37;
    border-radius: 17px;
    padding: 19px;
    box-shadow: 0 12px 35px rgba(0,0,0,.28);
}

.order-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 14px;
}

.order-top h3 {
    color: #F5F5F5;
    margin-bottom: 5px;
    font-size: 18px;
}

.order-id {
    color: #777;
    font-size: 12px;
}

.status {
    display: inline-block;
    height: fit-content;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
}

.status-payment {
    background: rgba(212,175,55,.12);
    color: #F4D77D;
}

.status-preparing {
    background: rgba(80,120,160,.14);
    color: #9fc5e8;
}

.status-ready {
    background: rgba(70,150,90,.13);
    color: #9ee0aa;
}

.status-completed {
    background: rgba(255,255,255,.07);
    color: #aaa;
}

.order-details {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
    margin: 13px 0;
}

.detail {
    background: #090909;
    border: 1px solid #202020;
    padding: 11px;
    border-radius: 10px;
}

.detail small {
    display: block;
    color: #666;
    margin-bottom: 5px;
    font-size: 11px;
}

.detail strong {
    color: #ddd;
    font-size: 13px;
}

.food-list {
    background: #090909;
    border: 1px solid #202020;
    border-radius: 10px;
    padding: 13px;
    color: #bbb;
    font-size: 13px;
    line-height: 1.5;
}

.food-list strong {
    color: #D4AF37;
}

.order-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

button.action {
    border: 1px solid transparent;
    padding: 10px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 800;
    font-size: 12px;
}

.verify {
    background: rgba(212,175,55,.14);
    color: #F4D77D;
    border-color: rgba(212,175,55,.3) !important;
}

.token {
    background: #D4AF37;
    color: #080808;
}

.ready {
    background: rgba(70,150,90,.16);
    color: #a7e5b1;
    border-color: rgba(70,150,90,.25) !important;
}

.complete {
    background: #222;
    color: #ddd;
}

button.action:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.token-display {
    background: rgba(212,175,55,.07);
    border: 1px dashed rgba(212,175,55,.55);
    padding: 13px;
    text-align: center;
    border-radius: 11px;
    margin-top: 12px;
}

.token-display div {
    color: #888;
    font-size: 12px;
}

.token-display strong {
    display: block;
    color: #F4D77D;
    font-size: 28px;
    margin-top: 3px;
}

.ready-message {
    background: rgba(70,150,90,.09);
    border: 1px solid rgba(70,150,90,.2);
    color: #9ee0aa;
    padding: 11px;
    border-radius: 10px;
    margin-top: 11px;
    font-size: 13px;
    font-weight: 700;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 14px;
}

.food-card {
    background: linear-gradient(145deg,#151515,#0e0e0e);
    border: 1px solid rgba(212,175,55,.16);
    border-radius: 16px;
    padding: 17px;
}

.food-card h3 {
    color: #F5F5F5;
    font-size: 17px;
    margin-bottom: 6px;
}

.food-category {
    color: #777;
    font-size: 11px;
    margin-bottom: 12px;
}

.food-price {
    color: #D4AF37;
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 12px;
}

.availability {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 12px;
}

.available {
    background: rgba(70,150,90,.12);
    color: #9ee0aa;
}

.unavailable {
    background: rgba(200,60,60,.1);
    color: #ff9999;
}

.stock-btn {
    width: 100%;
    border: 1px solid;
    padding: 10px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 800;
    font-size: 12px;
}

.out-btn {
    background: rgba(200,60,60,.1);
    border-color: rgba(200,60,60,.3);
    color: #ff9999;
}

.in-btn {
    background: rgba(212,175,55,.1);
    border-color: rgba(212,175,55,.3);
    color: #F4D77D;
}

.empty,
.loading {
    background: #101010;
    border: 1px solid #222;
    padding: 35px;
    text-align: center;
    border-radius: 14px;
    color: #777;
}

@media(max-width:900px) {

    .stats {
        grid-template-columns: repeat(3,1fr);
    }

    .menu-grid {
        grid-template-columns: repeat(2,1fr);
    }

}

@media(max-width:600px) {

    .staff-header {
        padding: 14px;
    }

    .brand {
        font-size: 21px;
    }

    .header-subtitle {
        font-size: 10px;
    }

    .container {
        padding: 18px 13px 45px;
    }

    .stats {
        grid-template-columns: repeat(2,1fr);
        gap: 8px;
    }

    .stat {
        padding: 14px 8px;
    }

    .stat h2 {
        font-size: 21px;
    }

    .section-tabs {
        width: 100%;
    }

    .tab-button {
        flex: 1;
        padding: 12px 8px;
    }

    .section-header {
        align-items: flex-start;
    }

    .section-header h2 {
        font-size: 19px;
    }

    .order-top {
        flex-direction: column;
    }

    .order-details {
        grid-template-columns: 1fr;
    }

    .order-actions {
        flex-direction: column;
    }

    button.action {
        width: 100%;
    }

    .menu-grid {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

<body>

<header class="staff-header">

    <div>
        <div class="brand">NextTurn</div>

        <div class="header-subtitle">
            Staff Dashboard • College Canteen
        </div>
    </div>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h2 id="totalOrders">0</h2>
            <p>Total Orders</p>
        </div>

        <div class="stat">
            <h2 id="pendingPayments">0</h2>
            <p>Pending Payments</p>
        </div>

        <div class="stat">
            <h2 id="preparingOrders">0</h2>
            <p>Preparing</p>
        </div>

        <div class="stat">
            <h2 id="readyOrders">0</h2>
            <p>Ready</p>
        </div>

        <div class="stat">
            <h2 id="completedOrders">0</h2>
            <p>Completed</p>
        </div>

    </div>

    <div class="section-tabs">

        <button
            id="ordersTab"
            class="tab-button active"
            onclick="showSection('orders')">
            📦 Orders
        </button>

        <button
            id="menuTab"
            class="tab-button"
            onclick="showSection('menu')">
            🍔 Menu
        </button>

    </div>

    <section id="ordersSection" class="section active">

        <div class="section-header">

            <h2>Incoming Orders</h2>

            <button
                class="refresh-btn"
                onclick="refreshOrders()">
                ↻ Refresh
            </button>

        </div>

        <div id="ordersContainer" class="orders-container">
            <div class="loading">
                Loading orders...
            </div>
        </div>

    </section>

    <section id="menuSection" class="section">

        <div class="section-header">

            <h2>Menu & Stock</h2>

            <button
                class="refresh-btn"
                onclick="refreshFood()">
                ↻ Refresh
            </button>

        </div>

        <div id="menuContainer" class="menu-grid">
            <div class="loading">
                Loading menu...
            </div>
        </div>

    </section>

</div>

<script>

const API = "https://nextturn-mgbf.onrender.com";

function showSection(section) {

    const ordersSection =
        document.getElementById("ordersSection");

    const menuSection =
        document.getElementById("menuSection");

    const ordersTab =
        document.getElementById("ordersTab");

    const menuTab =
        document.getElementById("menuTab");

    if (section === "orders") {

        ordersSection.classList.add("active");
        menuSection.classList.remove("active");

        ordersTab.classList.add("active");
        menuTab.classList.remove("active");

        refreshOrders();

    } else {

        menuSection.classList.add("active");
        ordersSection.classList.remove("active");

        menuTab.classList.add("active");
        ordersTab.classList.remove("active");

        refreshFood();

    }

}

async function refreshOrders() {

    const container =
        document.getElementById("ordersContainer");

    container.innerHTML =
        '<div class="loading">Loading orders...</div>';

    try {

        const response =
            await fetch(
                API + "/api/staff/orders?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const orders =
            await response.json();

        updateStats(orders);

        if (!orders.length) {

            container.innerHTML =
                '<div class="empty">No orders found.</div>';

            return;
        }

        container.innerHTML =
            orders.map(createOrderCard).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load orders.<br><br>
                Please refresh the page.
            </div>
        `;

    }

}

function createOrderCard(order) {

    const status =
        order.orderStatus || "Unknown";

    let statusClass =
        "status-payment";

    if (status === "Preparing") {
        statusClass = "status-preparing";
    }

    if (status === "Ready") {
        statusClass = "status-ready";
    }

    if (status === "Completed") {
        statusClass = "status-completed";
    }

    let foodText =
        "Food details unavailable";

    try {

        const items =
            typeof order.foodItems === "string"
                ? JSON.parse(order.foodItems)
                : order.foodItems;

        if (Array.isArray(items)) {

            foodText =
                items.map(item => {

                    return `${escapeHTML(item.name || "Food")} × ${item.quantity || 1}`;

                }).join("<br>");

        }

    } catch (e) {

        foodText =
            escapeHTML(
                order.foodItems ||
                "Food details unavailable"
            );

    }

    let buttons = "";

    if (order.paymentStatus !== "Verified") {

        buttons += `
            <button
                class="action verify"
                onclick="verifyPayment(${order.id})">
                ✓ Verify Payment
            </button>
        `;

    } else {

        buttons += `
            <button
                class="action verify"
                disabled>
                ✓ Payment Verified
            </button>
        `;

    }

    if (
        order.paymentStatus === "Verified" &&
        order.tokenNumber == null &&
        status !== "Completed"
    ) {

        buttons += `
            <button
                class="action token"
                onclick="generateToken(${order.id})">
                🎟 Generate Token
            </button>
        `;

    }

    if (
        status === "Preparing" &&
        order.tokenNumber != null
    ) {

        buttons += `
            <button
                class="action ready"
                onclick="markReady(${order.id})">
                ✓ Mark as Ready
            </button>
        `;

    }

    if (status === "Ready") {

        buttons += `
            <button
                class="action complete"
                onclick="markCompleted(${order.id})">
                ✓ Mark Completed
            </button>
        `;

    }

    let tokenHTML = "";

    if (order.tokenNumber != null) {

        tokenHTML = `
            <div class="token-display">

                <div>
                    Token Number
                </div>

                <strong>
                    #${escapeHTML(order.tokenNumber)}
                </strong>

            </div>
        `;

    }

    let readyMessage = "";

    if (status === "Ready") {

        readyMessage = `
            <div class="ready-message">

                🔔 Food is ready — student can collect
                Token #${escapeHTML(order.tokenNumber)}.

            </div>
        `;

    }

    return `
        <div class="order-card">

            <div class="order-top">

                <div>

                    <h3>
                        ${escapeHTML(
                            order.studentName || "Student"
                        )}
                    </h3>

                    <div class="order-id">
                        Order #${escapeHTML(order.id || "-")}
                    </div>

                </div>

                <span class="status ${statusClass}">
                    ${escapeHTML(status)}
                </span>

            </div>

            <div class="order-details">

                <div class="detail">

                    <small>
                        Student ID
                    </small>

                    <strong>
                        ${escapeHTML(
                            order.studentId || "-"
                        )}
                    </strong>

                </div>

                <div class="detail">

                    <small>
                        Payment
                    </small>

                    <strong>
                        ${escapeHTML(
                            order.paymentStatus || "-"
                        )}
                    </strong>

                </div>

                <div class="detail">

                    <small>
                        Total
                    </small>

                    <strong>
                        ₹${Number(
                            order.totalAmount || 0
                        ).toFixed(2)}
                    </strong>

                </div>

            </div>

            <div class="food-list">

                <strong>
                    Order Items
                </strong>

                <br><br>

                ${foodText}

            </div>

            ${tokenHTML}

            ${readyMessage}

            <div class="order-actions">
                ${buttons}
            </div>

        </div>
    `;

}
   async function verifyPayment(id) {
            try {
                const response = await fetch(`${API}/api/staff/payments/${id}/verify`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Payment verification failed");
                }

                alert("Payment verified successfully.");
                refreshOrders();
            } catch (error) {
                console.error(error);
                alert("Unable to verify payment.");
            }
        }

        async function generateToken(id) {
            try {
                const response = await fetch(`${API}/api/staff/tokens/${id}/generate`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Token generation failed");
                }

                alert("Token generated successfully.");
                refreshOrders();
            } catch (error) {
                console.error(error);
                alert("Unable to generate token.");
            }
        }

        async function markReady(id) {
            try {
                const response = await fetch(`${API}/api/staff/ready/${id}`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Unable to mark order ready");
                }

                alert("Order marked as ready.");
                refreshOrders();
            } catch (error) {
                console.error(error);
                alert("Unable to update order.");
            }
        }

        async function markCompleted(id) {
            try {
                const response = await fetch(`${API}/api/staff/orders/${id}/complete`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Unable to complete order");
                }

                alert("Order completed successfully.");
                refreshOrders();
            } catch (error) {
                console.error(error);
                alert("Unable to complete order.");
            }
        }

        function updateStats(orders) {
            const total = orders.length;

            const pendingPayments = orders.filter(order =>
                String(order.paymentStatus || "").toLowerCase().includes("pending")
            ).length;

            const preparing = orders.filter(order => {
                const status = String(order.orderStatus || "").toLowerCase();
                return status.includes("preparing") ||
                       status.includes("payment submitted") ||
                       status.includes("verified");
            }).length;

            const ready = orders.filter(order =>
                String(order.orderStatus || "").toLowerCase().includes("ready")
            ).length;

            const completed = orders.filter(order =>
                String(order.orderStatus || "").toLowerCase().includes("completed")
            ).length;

            document.getElementById("totalOrders").textContent = total;
            document.getElementById("pendingPayments").textContent = pendingPayments;
            document.getElementById("preparingOrders").textContent = preparing;
            document.getElementById("readyOrders").textContent = ready;
            document.getElementById("completedOrders").textContent = completed;
        }

        async function refreshFood() {
            const foodContainer = document.getElementById("foodContainer");

            try {
                const response = await fetch(`${API}/api/staff/food?t=${Date.now()}`, {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Unable to load food");
                }

                const food = await response.json();

                if (!Array.isArray(food) || food.length === 0) {
                    foodContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">🍽</div>
                            <h3>No food items found</h3>
                            <p>Food items will appear here once they are available.</p>
                        </div>
                    `;
                    return;
                }

                foodContainer.innerHTML = food.map(createFoodCard).join("");

            } catch (error) {
                console.error(error);

                foodContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">⚠</div>
                        <h3>Unable to load menu</h3>
                        <p>Please check the backend connection and try again.</p>
                    </div>
                `;
            }
        }

        function createFoodCard(food) {
            const available =
                food.available === true ||
                String(food.available).toLowerCase() === "true";

            const foodId = food.id;

            return `
                <div class="food-card">
                    <div class="food-card-top">
                        <div>
                            <div class="food-name">
                                ${escapeHTML(food.name || "Food Item")}
                            </div>

                            <div class="food-category">
                                ${escapeHTML(food.category || "General")}
                            </div>
                        </div>

                        <div class="availability-badge ${available ? "available" : "unavailable"}">
                            ${available ? "Available" : "Out of Stock"}
                        </div>
                    </div>

                    <div class="food-card-bottom">
                        <div class="food-price">
                            ₹${Number(food.price || 0).toFixed(2)}
                        </div>

                        ${
                            available
                            ? `
                                <button
                                    class="food-action danger"
                                    onclick="markOutOfStock(${foodId})">
                                    Mark Out
                                </button>
                            `
                            : `
                                <button
                                    class="food-action success"
                                    onclick="markAvailable(${foodId})">
                                    Make Available
                                </button>
                            `
                        }
                    </div>
                </div>
            `;
        }

        async function markOutOfStock(id) {
            try {
                const response = await fetch(`${API}/api/staff/food/${id}/unavailable`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Unable to update food");
                }

                alert("Food item marked as out of stock.");
                refreshFood();

            } catch (error) {
                console.error(error);
                alert("Unable to update food availability.");
            }
        }

        async function markAvailable(id) {
            try {
                const response = await fetch(`${API}/api/staff/food/${id}/available`, {
                    method: "PUT"
                });

                if (!response.ok) {
                    throw new Error("Unable to update food");
                }

                alert("Food item is now available.");
                refreshFood();

            } catch (error) {
                console.error(error);
                alert("Unable to update food availability.");
            }
        }

        function escapeHTML(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function logout() {
            localStorage.removeItem("nextTurnStaff");
            localStorage.removeItem("nextTurnUser");
            localStorage.removeItem("nextTurnRole");

            window.location.href = "login.html";
        }

        refreshOrders();
        refreshFood();

        setInterval(() => {
            refreshOrders();
        }, 5000);

        setInterval(() => {
            refreshFood();
        }, 10000);
    </script>

</body>
</html>
