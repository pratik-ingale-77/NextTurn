<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextTurn - Staff Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #f5f5f5;
    min-height: 100vh;
}

button {
    font-family: inherit;
}

.header {
    border-bottom: 1px solid rgba(212,175,55,0.25);
    background: rgba(8,8,8,0.96);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.brand {
    color: #f4d77d;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: .5px;
}

.subtitle {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
}

.logout-btn,
.refresh-btn,
.action-btn {
    border: 1px solid #d4af37;
    background: transparent;
    color: #f4d77d;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
}

.logout-btn:hover,
.refresh-btn:hover,
.action-btn:hover {
    background: #d4af37;
    color: #080808;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 25px 20px 50px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 25px;
}

.stat-card {
    background: #111;
    border: 1px solid rgba(212,175,55,.2);
    border-radius: 16px;
    padding: 18px;
}

.stat-label {
    color: #999;
    font-size: 12px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 25px;
    font-weight: 800;
    color: #f4d77d;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(212,175,55,.3);
    background: #111;
    color: #aaa;
    cursor: pointer;
    font-weight: 700;
}

.tab-btn.active {
    background: #d4af37;
    color: #080808;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.section-title {
    font-size: 22px;
    color: #f4d77d;
}

.orders-grid,
.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.order-card,
.food-card {
    background: #111;
    border: 1px solid rgba(212,175,55,.22);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
}

.latest-order {
    border-color: #d4af37;
    box-shadow: 0 0 25px rgba(212,175,55,.12);
}

.latest-badge {
    display: inline-block;
    background: #d4af37;
    color: #080808;
    font-size: 11px;
    font-weight: 800;
    padding: 6px 9px;
    border-radius: 20px;
    margin-bottom: 12px;
}

.order-top,
.food-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
}

.student-name,
.food-name {
    font-size: 18px;
    font-weight: 800;
    color: #f5f5f5;
}

.small-text {
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}

.amount {
    color: #f4d77d;
    font-weight: 800;
    font-size: 18px;
}

.info-box {
    background: #0b0b0b;
    border-radius: 12px;
    padding: 13px;
    margin-top: 15px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 6px 0;
    font-size: 13px;
}

.info-row span:first-child {
    color: #888;
}

.info-row span:last-child {
    text-align: right;
}

.status {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 20px;
    background: rgba(212,175,55,.12);
    color: #f4d77d;
    font-size: 11px;
    font-weight: 700;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.action-btn {
    font-size: 12px;
    padding: 9px 12px;
}

.action-btn.primary {
    background: #d4af37;
    color: #080808;
}

.food-card {
    min-height: 180px;
}

.food-icon {
    font-size: 35px;
}

.available {
    color: #8fd18f;
    font-size: 12px;
    font-weight: 700;
}

.unavailable {
    color: #e88;
    font-size: 12px;
    font-weight: 700;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 45px 20px;
    background: #111;
    border: 1px dashed rgba(212,175,55,.25);
    border-radius: 18px;
    color: #888;
}

.loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px;
    color: #aaa;
}

@media (max-width: 850px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .orders-grid,
    .menu-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 600px) {
    .header-inner {
        padding: 15px;
    }

    .container {
        padding: 20px 14px 40px;
    }

    .brand {
        font-size: 22px;
    }

    .logout-btn {
        padding: 8px 11px;
        font-size: 12px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat-card {
        padding: 14px;
    }

    .stat-value {
        font-size: 21px;
    }

    .section-head {
        align-items: flex-start;
    }

    .section-title {
        font-size: 19px;
    }

    .refresh-btn {
        padding: 8px 11px;
        font-size: 12px;
    }

    .order-card,
    .food-card {
        padding: 16px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <div class="brand">NextTurn</div>
            <div class="subtitle">Staff Dashboard • College Canteen</div>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">

    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Orders</div>
            <div class="stat-value" id="totalOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Pending Payments</div>
            <div class="stat-value" id="pendingPayments">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Preparing</div>
            <div class="stat-value" id="preparingOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Ready</div>
            <div class="stat-value" id="readyOrders">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Completed</div>
            <div class="stat-value" id="completedOrders">0</div>
        </div>
    </div>

    <div class="tabs">
        <button id="ordersTab"
                class="tab-btn active"
                onclick="showSection('orders')">
            Orders
        </button>

        <button id="menuTab"
                class="tab-btn"
                onclick="showSection('menu')">
            Menu
        </button>
    </div>

    <!-- ORDERS -->
    <section id="ordersSection" class="section active">

        <div class="section-head">
            <h2 class="section-title">Latest Incoming Orders</h2>

            <button class="refresh-btn" onclick="loadOrders()">
                ↻ Refresh
            </button>
        </div>

        <div id="ordersContainer" class="orders-grid">
            <div class="loading">Loading orders...</div>
        </div>

    </section>

    <!-- MENU -->
    <section id="menuSection" class="section">

        <div class="section-head">
            <h2 class="section-title">Canteen Menu</h2>

            <button class="refresh-btn" onclick="loadFood()">
                ↻ Refresh
            </button>
        </div>

        <!-- IMPORTANT: JavaScript uses this exact ID -->
        <div id="menuContainer" class="menu-grid">
            <div class="loading">Loading menu...</div>
        </div>

    </section>

             </main>
 <script>
const API = "https://nextturn-mgbf.onrender.com";

const ordersContainer = document.getElementById("ordersContainer");
const foodContainer = document.getElementById("menuContainer");

let orders = [];
let foodItems = [];


/* =========================
   SECTION SWITCHING
========================= */

function showSection(section) {

    const ordersSection = document.getElementById("ordersSection");
    const menuSection = document.getElementById("menuSection");

    const ordersTab = document.getElementById("ordersTab");
    const menuTab = document.getElementById("menuTab");

    if (section === "orders") {

        ordersSection.classList.add("active");
        menuSection.classList.remove("active");

        ordersTab.classList.add("active");
        menuTab.classList.remove("active");

        loadOrders();

    } else {

        ordersSection.classList.remove("active");
        menuSection.classList.add("active");

        ordersTab.classList.remove("active");
        menuTab.classList.add("active");

        loadFood();
    }
}


/* =========================
   SECURITY / HTML ESCAPE
========================= */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders() {

    ordersContainer.innerHTML =
        `<div class="loading">Loading latest orders...</div>`;

    try {

        const response = await fetch(
            `${API}/api/staff/orders?t=${Date.now()}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to load orders");
        }

        const data = await response.json();

        orders = Array.isArray(data)
            ? data
            : [];

        /*
         * Latest order first.
         * createdAt is preferred.
         * id is used as fallback.
         */
        orders.sort((a, b) => {

            const dateA = new Date(a.createdAt || 0).getTime();
            const dateB = new Date(b.createdAt || 0).getTime();

            if (dateA && dateB && dateA !== dateB) {
                return dateB - dateA;
            }

            return Number(b.id || 0) - Number(a.id || 0);
        });

        updateStats();
        renderOrders();

    } catch (error) {

        console.error("Orders error:", error);

        ordersContainer.innerHTML = `
            <div class="empty">
                <h3>Unable to load orders</h3>
                <p style="margin-top:8px;">
                    Please check the backend connection and try again.
                </p>

                <button
                    class="refresh-btn"
                    style="margin-top:15px;"
                    onclick="loadOrders()">
                    Try Again
                </button>
            </div>
        `;
    }
}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders() {

    if (!orders.length) {

        ordersContainer.innerHTML = `
            <div class="empty">
                <h3>No orders yet</h3>
                <p style="margin-top:8px;">
                    New student orders will appear here automatically.
                </p>
            </div>
        `;

        return;
    }

    ordersContainer.innerHTML = orders.map((order, index) => {

        const paymentStatus =
            order.paymentStatus || "Pending Verification";

        const orderStatus =
            order.orderStatus || "Payment Submitted";

        const total =
            Number(order.totalAmount || 0);

        const token =
            order.tokenNumber || "Not Generated";

        const createdAt =
            order.createdAt
                ? new Date(order.createdAt).toLocaleString("en-IN")
                : "Time unavailable";

        let foodItemsText = "No food details";

        try {

            if (Array.isArray(order.foodItems)) {

                foodItemsText = order.foodItems
                    .map(item => {

                        if (typeof item === "string") {
                            return item;
                        }

                        const name = item.name || item.foodName || "Food";
                        const quantity = item.quantity || 1;

                        return `${name} × ${quantity}`;
                    })
                    .join(", ");

            } else if (typeof order.foodItems === "string") {

                try {

                    const parsed =
                        JSON.parse(order.foodItems);

                    if (Array.isArray(parsed)) {

                        foodItemsText = parsed
                            .map(item => {

                                if (typeof item === "string") {
                                    return item;
                                }

                                const name =
                                    item.name ||
                                    item.foodName ||
                                    "Food";

                                const quantity =
                                    item.quantity || 1;

                                return `${name} × ${quantity}`;
                            })
                            .join(", ");

                    } else {

                        foodItemsText =
                            order.foodItems;
                    }

                } catch {

                    foodItemsText =
                        order.foodItems;
                }

            } else if (order.foodItems) {

                foodItemsText =
                    String(order.foodItems);
            }

        } catch {

            foodItemsText = "Food details unavailable";
        }


        const paymentPending =
            paymentStatus.toLowerCase().includes("pending") ||
            paymentStatus.toLowerCase().includes("submitted");

        const paymentVerified =
            paymentStatus.toLowerCase().includes("verified") ||
            paymentStatus.toLowerCase().includes("paid");


        const statusLower =
            orderStatus.toLowerCase();


        const preparing =
            statusLower.includes("preparing") ||
            statusLower.includes("in progress");

        const ready =
            statusLower.includes("ready");

        const completed =
            statusLower.includes("completed");


        return `
            <div class="order-card ${index === 0 ? "latest-order" : ""}">

                ${
                    index === 0
                    ? `<div class="latest-badge">● LATEST ORDER</div>`
                    : ""
                }

                <div class="order-top">

                    <div>
                        <div class="student-name">
                            ${escapeHTML(order.studentName || "Student")}
                        </div>

                        <div class="small-text">
                            ID:
                            ${escapeHTML(order.studentId || "N/A")}
                        </div>

                        <div class="small-text">
                            ${escapeHTML(order.studentEmail || "")}
                        </div>
                    </div>

                    <div class="amount">
                        ₹${total.toFixed(2)}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-row">
                        <span>Food</span>
                        <span>
                            ${escapeHTML(foodItemsText)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span>Payment</span>
                        <span class="status">
                            ${escapeHTML(paymentStatus)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span>Order Status</span>
                        <span class="status">
                            ${escapeHTML(orderStatus)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span>Token</span>
                        <span>
                            ${escapeHTML(token)}
                        </span>
                    </div>

                    <div class="info-row">
                        <span>Time</span>
                        <span>
                            ${escapeHTML(createdAt)}
                        </span>
                    </div>

                </div>


                <div class="actions">

                    ${
                        paymentPending
                        ? `
                            <button
                                class="action-btn primary"
                                onclick="verifyPayment(${order.id})">
                                ✓ Verify Payment
                            </button>
                        `
                        : ""
                    }


                    ${
                        paymentVerified && !token || token === "Not Generated"
                        ? `
                            <button
                                class="action-btn primary"
                                onclick="generateToken(${order.id})">
                                Generate Token
                            </button>
                        `
                        : ""
                    }


                    ${
                        !completed && !ready
                        ? `
                            <button
                                class="action-btn"
                                onclick="markReady(${order.id})">
                                Mark Ready
                            </button>
                        `
                        : ""
                    }


                    ${
                        ready && !completed
                        ? `
                            <button
                                class="action-btn primary"
                                onclick="completeOrder(${order.id})">
                                ✓ Complete Order
                            </button>
                        `
                        : ""
                    }

                </div>

            </div>
        `;

    }).join("");
}


/* =========================
   UPDATE STATISTICS
========================= */

function updateStats() {

    const total =
        orders.length;

    const pending =
        orders.filter(order => {

            const status =
                String(order.paymentStatus || "")
                    .toLowerCase();

            return status.includes("pending") ||
                   status.includes("submitted");

        }).length;


    const preparingCount =
        orders.filter(order => {

            const status =
                String(order.orderStatus || "")
                    .toLowerCase();

            return status.includes("preparing") ||
                   status.includes("in progress");

        }).length;


    const readyCount =
        orders.filter(order => {

            const status =
                String(order.orderStatus || "")
                    .toLowerCase();

            return status.includes("ready");

        }).length;


    const completedCount =
        orders.filter(order => {

            const status =
                String(order.orderStatus || "")
                    .toLowerCase();

            return status.includes("completed");

        }).length;


    document.getElementById("totalOrders")
        .textContent = total;

    document.getElementById("pendingPayments")
        .textContent = pending;

    document.getElementById("preparingOrders")
        .textContent = preparingCount;

    document.getElementById("readyOrders")
        .textContent = readyCount;

    document.getElementById("completedOrders")
        .textContent = completedCount;
}


/* =========================
   VERIFY PAYMENT
========================= */

async function verifyPayment(id) {

    if (!confirm("Verify payment for this order?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/payments/${id}/verify`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Payment verification failed");
        }

        alert("Payment verified successfully.");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Could not verify payment. Please try again."
        );
    }
}


/* =========================
   GENERATE TOKEN
========================= */

async function generateToken(id) {

    if (!confirm("Generate token for this order?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/tokens/${id}/generate`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Token generation failed");
        }

        alert("Token generated successfully.");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Could not generate token. Please try again."
        );
    }
}


/* =========================
   MARK READY
========================= */

async function markReady(id) {

    if (!confirm("Mark this order as ready?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/ready/${id}`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Could not mark ready");
        }

        alert("Order marked as ready.");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Could not update order status."
        );
    }
}


/* =========================
   COMPLETE ORDER
========================= */

async function completeOrder(id) {

    if (!confirm("Complete this order?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/orders/${id}/complete`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Could not complete order");
        }

        alert("Order completed successfully.");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Could not complete order."
        );
    }
}


/* =========================
   LOAD FOOD MENU
========================= */

async function loadFood() {

    foodContainer.innerHTML =
        `<div class="loading">Loading menu...</div>`;

    try {

        const response = await fetch(
            `${API}/api/staff/food?t=${Date.now()}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Failed to load menu");
        }

        const data = await response.json();

        foodItems = Array.isArray(data)
            ? data
            : [];

        renderFood();

    } catch (error) {

        console.error("Menu error:", error);

        foodContainer.innerHTML = `
            <div class="empty">

                <h3>Unable to load menu</h3>

                <p style="margin-top:8px;">
                    Please check the backend connection.
                </p>

                <button
                    class="refresh-btn"
                    style="margin-top:15px;"
                    onclick="loadFood()">
                    Try Again
                </button>

            </div>
        `;
    }
}


/* =========================
   RENDER FOOD MENU
========================= */

function renderFood() {

    if (!foodItems.length) {

        foodContainer.innerHTML = `
            <div class="empty">

                <h3>No menu items found</h3>

                <p style="margin-top:8px;">
                    Add food items from the backend.
                </p>

            </div>
        `;

        return;
    }


    foodContainer.innerHTML =
        foodItems.map(food => {

            const available =
                food.available === true ||
                food.available === "true" ||
                food.available === 1;


            const price =
                Number(food.price || 0);


            return `
                <div class="food-card">

                    <div class="food-top">

                        <div>

                            <div class="food-icon">
                                ${escapeHTML(food.icon || "🍽️")}
                            </div>

                            <div class="food-name">
                                ${escapeHTML(
                                    food.name ||
                                    food.foodName ||
                                    "Food Item"
                                )}
                            </div>

                            <div class="small-text">
                                ${escapeHTML(
                                    food.category || "Food"
                                )}
                            </div>

                        </div>

                        <div class="amount">
                            ₹${price.toFixed(2)}
                        </div>

                    </div>


                    <div class="info-box">

                        <div class="info-row">

                            <span>Availability</span>

                            <span class="${
                                available
                                ? "available"
                                : "unavailable"
                            }">

                                ${
                                    available
                                    ? "● Available"
                                    : "● Unavailable"
                                }

                            </span>

                        </div>

                    </div>


                    <div class="actions">

                        ${
                            available
                            ? `
                                <button
                                    class="action-btn"
                                    onclick="makeUnavailable(${food.id})">
                                    Make Unavailable
                                </button>
                            `
                            : `
                                <button
                                    class="action-btn primary"
                                    onclick="makeAvailable(${food.id})">
                                    Make Available
                                </button>
                            `
                        }

                    </div>

                </div>
            `;

        }).join("");
}
/* =========================
   MAKE FOOD UNAVAILABLE
========================= */

async function makeUnavailable(id) {

    if (!confirm("Make this food unavailable?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/food/${id}/unavailable`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        alert("Food marked unavailable.");

        await loadFood();

    } catch (error) {

        console.error("Unavailable error:", error);

        alert(
            "Could not update food availability."
        );
    }
}


/* =========================
   MAKE FOOD AVAILABLE
========================= */

async function makeAvailable(id) {

    if (!confirm("Make this food available?")) {
        return;
    }

    try {

        const response = await fetch(
            `${API}/api/staff/food/${id}/available`,
            {
                method: "PUT"
            }
        );

        if (!response.ok) {
            throw new Error("Update failed");
        }

        alert("Food marked available.");

        await loadFood();

    } catch (error) {

        console.error("Available error:", error);

        alert(
            "Could not update food availability."
        );
    }
}


/* =========================
   LOGOUT
========================= */

function logout() {

    localStorage.removeItem("nextTurnStaff");
    localStorage.removeItem("nextTurnUser");
    localStorage.removeItem("nextTurnRole");

    window.location.href = "login.html";
}


/* =========================
   AUTO REFRESH ORDERS
========================= */

setInterval(() => {

    const ordersSection =
        document.getElementById("ordersSection");

    if (
        ordersSection &&
        ordersSection.classList.contains("active")
    ) {
        loadOrders();
    }

}, 5000);


/* =========================
   AUTO REFRESH MENU
========================= */

setInterval(() => {

    const menuSection =
        document.getElementById("menuSection");

    if (
        menuSection &&
        menuSection.classList.contains("active")
    ) {
        loadFood();
    }

}, 10000);


/* =========================
   INITIAL LOAD
========================= */

document.addEventListener("DOMContentLoaded", () => {

    loadOrders();

});
</script>
