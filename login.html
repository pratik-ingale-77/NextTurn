<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>NextTurn | College Canteen Login</title>
  <meta name="description" content="Sign in to NextTurn, a college canteen ordering and queue management system.">
  <link rel="stylesheet" href="styles.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, rgba(212,175,55,.12), transparent 40%), #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .wrapper { width: 100%; max-width: 440px; }

    .brand { text-align: center; margin-bottom: 24px; }

    .brand h1 {
      color: #D4AF37;
      font-size: 36px;
      margin: 0 0 8px;
    }

    .brand p { color: #999; font-size: 14px; margin: 0; }

    .card {
      padding: 28px;
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,.25);
      background: linear-gradient(145deg,#171717,#0d0d0d);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .welcome h2 { font-size: 24px; margin: 0 0 8px; }

    .welcome p {
      color: #999;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .label-title {
      display: block;
      color: #bbb;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .roles, .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .tabs {
      grid-template-columns: repeat(2, 1fr);
      padding: 5px;
      background: #090909;
      border: 1px solid #292929;
      border-radius: 12px;
    }

    button { font: inherit; cursor: pointer; }

    .role, .tab {
      padding: 12px 5px;
      border-radius: 10px;
      border: 1px solid #303030;
      background: #0b0b0b;
      color: #bbb;
      font-size: 13px;
      font-weight: bold;
    }

    .tab { border: none; }

    .role.active, .tab.active, .submit {
      color: #080808;
      background: linear-gradient(135deg,#D4AF37,#F4D77D);
    }

    .field { margin-bottom: 17px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
      font-weight: bold;
    }

    .field input {
      width: 100%;
      padding: 14px;
      background: #090909;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .field input:focus { border-color: #D4AF37; }

    .submit {
      width: 100%;
      padding: 15px;
      margin-top: 4px;
      border: none;
      border-radius: 11px;
      font-size: 15px;
      font-weight: bold;
    }

    .submit:disabled { opacity: .6; cursor: wait; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.show { display: block; }
    .message.success { color: #f4d77d; background: #211d0d; }
    .message.error { color: #ffaaaa; background: #251010; }
    .hidden { display: none !important; }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover { color: #D4AF37; }

    .privacy {
      margin-top: 18px;
      text-align: center;
      color: #888;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 380px) {
      .card { padding: 20px; }
      .brand h1 { font-size: 30px; }
    }
  </style>
</head>

<body>
  <main class="wrapper">
    <header class="brand">
      <h1>NextTurn</h1>
      <p>College Canteen Ordering System</p>
    </header>

    <section class="card">
      <div class="welcome">
        <h2>Welcome to NextTurn</h2>
        <p>Sign in to manage your canteen orders and queue.</p>
      </div>

      <span class="label-title">Choose account type</span>

      <div class="roles">
        <button type="button" class="role active" data-role="student">Student</button>
        <button type="button" class="role" data-role="staff">Staff</button>
        <button type="button" class="role" data-role="partner">Partner</button>
      </div>

      <section id="studentSection">
        <div class="tabs">
          <button type="button" class="tab active" id="loginTab">Login</button>
          <button type="button" class="tab" id="registerTab">Register</button>
        </div>

        <form id="studentLoginForm">
          <div class="field">
            <label for="studentEmail">College Email</label>
            <input id="studentEmail" type="email"
              placeholder="Enter your registered email"
              autocomplete="username" required>
          </div>

          <div class="field">
            <label for="studentPassword">NextTurn Password</label>
            <input id="studentPassword" type="password"
              placeholder="Enter your NextTurn password"
              autocomplete="current-password" required>
          </div>

          <button class="submit" id="studentLoginBtn" type="submit">
            Login as Student
          </button>
        </form>

        <form id="studentRegisterForm" class="hidden">
          <div class="field">
            <label for="fullName">Full Name</label>
            <input id="fullName" type="text" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="studentId">College Student ID</label>
            <input id="studentId" type="text" autocomplete="off" required>
          </div>

          <div class="field">
            <label for="registerEmail">College Email</label>
            <input id="registerEmail" type="email"
              placeholder="Enter your college email"
              autocomplete="email" required>
          </div>

          <div class="field">
            <label for="registerPassword">Create Password</label>
            <input id="registerPassword" type="password"
              minlength="6" autocomplete="new-password" required>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password"
              minlength="6" autocomplete="new-password" required>
          </div>

          <button class="submit" id="registerBtn" type="submit">
            Create Student Account
          </button>
        </form>
      </section>

      <form id="otherLoginForm" class="hidden">
        <div class="field">
          <label id="otherLabel" for="otherId">Staff ID</label>
          <input id="otherId" type="text" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="otherPassword">NextTurn Password</label>
          <input id="otherPassword" type="password"
            autocomplete="current-password" required>
        </div>

        <button class="submit" id="otherLoginBtn" type="submit">
          Login as Staff
        </button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <a href="index.html" class="back">← Back to Home</a>

      <div class="privacy">
        <strong>NextTurn Account Portal</strong><br>
        For the college canteen ordering system.<br>
        Never enter your Google account password here.
      </div>
    </section>
    </main>
      <script>
    "use strict";

    const API_BASE_URL = "https://nextturn-mgbf.onrender.com";
    let selectedRole = "student";

    const $ = id => document.getElementById(id);

    function showMessage(text, type = "error") {
      const box = $("message");
      box.textContent = text;
      box.className = "message show " + type;
    }

    function hideMessage() {
      $("message").textContent = "";
      $("message").className = "message";
    }

    async function postJSON(endpoint, payload) {
      const response = await fetch(API_BASE_URL + endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }

      if (!response.ok) {
        if (response.status === 409) {
          throw new Error("This account or student ID is already registered.");
        }

        throw new Error(
          data.message || data.error || "Request failed. Please try again."
        );
      }

      return data;
    }

    function setLoading(button, loading, label) {
      button.disabled = loading;
      button.textContent = loading ? "Please wait..." : label;
    }

    function showStudentLogin() {
      $("studentLoginForm").classList.remove("hidden");
      $("studentRegisterForm").classList.add("hidden");
      $("loginTab").classList.add("active");
      $("registerTab").classList.remove("active");
      hideMessage();
    }

    function showStudentRegister() {
      $("studentLoginForm").classList.add("hidden");
      $("studentRegisterForm").classList.remove("hidden");
      $("loginTab").classList.remove("active");
      $("registerTab").classList.add("active");
      hideMessage();
    }

    $("loginTab").addEventListener("click", showStudentLogin);
    $("registerTab").addEventListener("click", showStudentRegister);

    document.querySelectorAll(".role").forEach(button => {
      button.addEventListener("click", () => {
        selectedRole = button.dataset.role;

        document.querySelectorAll(".role").forEach(item => {
          item.classList.toggle("active", item === button);
        });

        const isStudent = selectedRole === "student";

        $("studentSection").classList.toggle("hidden", !isStudent);
        $("otherLoginForm").classList.toggle("hidden", isStudent);

        if (!isStudent) {
          const isStaff = selectedRole === "staff";

          $("otherLabel").textContent = isStaff ? "Staff ID" : "Partner ID";
          $("otherId").placeholder = isStaff
            ? "Enter your Staff ID"
            : "Enter your Partner ID";

          $("otherLoginBtn").textContent = isStaff
            ? "Login as Staff"
            : "Login as Partner";

          $("otherLoginForm").reset();
        }

        hideMessage();
      });
    });

    $("studentLoginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("studentLoginBtn");
      setLoading(button, true, "Login as Student");
      hideMessage();

      try {
        const data = await postJSON("/api/student-login", {
          email: $("studentEmail").value.trim(),
          password: $("studentPassword").value
        });

        localStorage.setItem("nextTurnRole", "student");
        localStorage.setItem("nextTurnUser", JSON.stringify(data));

        if (data.studentId) {
          localStorage.setItem("nextTurnStudentId", data.studentId);
        }

        showMessage("Login successful. Opening your dashboard...", "success");

        setTimeout(() => {
          window.location.href = "student.html";
        }, 700);

      } catch (error) {
        showMessage(error.message || "Unable to log in.");
      } finally {
        setLoading(button, false, "Login as Student");
      }
    });

    $("studentRegisterForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("registerBtn");
      hideMessage();

      const fullName = $("fullName").value.trim();
      const studentId = $("studentId").value.trim();
      const email = $("registerEmail").value.trim();
      const password = $("registerPassword").value;
      const confirmPassword = $("confirmPassword").value;

      if (password.length < 6) {
        showMessage("Your password must contain at least 6 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      setLoading(button, true, "Create Student Account");

      try {
        await postJSON("/api/student-register", {
          fullName,
          studentId,
          email,
          password
        });

        $("studentRegisterForm").reset();
        showMessage("Account created. You can now log in.", "success");

        setTimeout(showStudentLogin, 1200);

      } catch (error) {
        showMessage(error.message || "Registration failed.");
      } finally {
        setLoading(button, false, "Create Student Account");
      }
    });

    $("otherLoginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const button = $("otherLoginBtn");
      const loginValue = $("otherId").value.trim();
      const password = $("otherPassword").value;
      const isStaff = selectedRole === "staff";

      const endpoint = isStaff
        ? "/api/staff-login"
        : "/api/partner-login";

      const payload = isStaff
        ? { staffId: loginValue, password }
        : { partnerId: loginValue, password };

      setLoading(
        button,
        true,
        isStaff ? "Login as Staff" : "Login as Partner"
      );

      hideMessage();

      try {
        const data = await postJSON(endpoint, payload);

        localStorage.setItem("nextTurnRole", selectedRole);
        localStorage.setItem("nextTurnUser", JSON.stringify(data));

        if (!isStaff && data.partnerId) {
          localStorage.setItem("nextTurnPartnerId", data.partnerId);
        }

        showMessage("Login successful. Opening your dashboard...", "success");

        setTimeout(() => {
          window.location.href = isStaff ? "staff.html" : "partner.html";
        }, 700);

      } catch (error) {
        showMessage(error.message || "Unable to log in.");
      } finally {
        setLoading(
          button,
          false,
          isStaff ? "Login as Staff" : "Login as Partner"
        );
      }
    });

    showStudentLogin();
  </script>
</body>
    </html>
