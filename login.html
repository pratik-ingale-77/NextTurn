<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextTurn - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #07152f, #0d2b5c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #0b2d63;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .roles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 25px;
        }

        .role-btn {
            padding: 12px 5px;
            border: 2px solid #d8dce5;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
        }

        .role-btn.active {
            background: #0b2d63;
            color: white;
            border-color: #0b2d63;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0b2d63;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0b2d63;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #061d43;
        }

        .login-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .success {
            display: block;
            background: #e8f7ee;
            color: #176b36;
        }

        .error {
            display: block;
            background: #fdeaea;
            color: #a32020;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0b2d63;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 450px) {
            .login-container {
                padding: 22px;
            }

            .roles {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">⚡ NextTurn</div>

    <div class="subtitle">
        College Canteen Digital Ordering
    </div>

    <div class="roles">
        <button class="role-btn active" onclick="selectRole('student', this)">
            Student
        </button>

        <button class="role-btn" onclick="selectRole('staff', this)">
            Staff
        </button>

        <button class="role-btn" onclick="selectRole('partner', this)">
            Partner
        </button>
    </div>

    <form id="loginForm">

        <div class="form-group">
            <label id="emailLabel">Gmail</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your Gmail"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >
        </div>

        <button
            type="submit"
            class="login-btn"
            id="loginBtn"
        >
            Login as Student
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

    // LIVE JAVA SPRING BOOT BACKEND
    const API_BASE_URL = "https://nextturn-mgbf.onrender.com";

    let selectedRole = "student";

    function selectRole(role, button) {

        selectedRole = role;

        document.querySelectorAll(".role-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        const emailLabel = document.getElementById("emailLabel");
        const emailInput = document.getElementById("email");
        const loginBtn = document.getElementById("loginBtn");

        if (role === "student") {

            emailLabel.textContent = "Gmail";
            emailInput.placeholder = "Enter your Gmail";
            loginBtn.textContent = "Login as Student";

        } else if (role === "staff") {

            emailLabel.textContent = "Staff ID";
            emailInput.placeholder = "Enter Staff ID";
            loginBtn.textContent = "Login as Staff";

        } else {

            emailLabel.textContent = "Partner ID";
            emailInput.placeholder = "Enter Partner ID";
            loginBtn.textContent = "Login as Partner";
        }

        hideMessage();
    }


    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const loginBtn = document.getElementById("loginBtn");

        hideMessage();

        if (!email || !password) {

            showMessage(
                "Please enter your login details.",
                "error"
            );

            return;
        }

        let endpoint = "";

        if (selectedRole === "student") {

            endpoint = "/api/student-login";

        } else if (selectedRole === "staff") {

            endpoint = "/api/staff-login";

        } else {

            endpoint = "/api/partner-login";
        }


        loginBtn.disabled = true;
        loginBtn.textContent = "Logging in...";


        try {

            const response = await fetch(
                API_BASE_URL + endpoint,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            let data = {};

            try {
                data = await response.json();
            } catch {
                data = {};
            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Invalid login details."
                );
            }


            // Save session information
            localStorage.setItem(
                "nextTurnRole",
                selectedRole
            );

            localStorage.setItem(
                "nextTurnUser",
                JSON.stringify(data)
            );


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(function() {

                if (selectedRole === "student") {

                    window.location.href = "student.html";

                } else if (selectedRole === "staff") {

                    window.location.href = "staff.html";

                } else {

                    window.location.href = "partner.html";
                }

            }, 700);


        } catch (error) {

            console.error("Login error:", error);

            if (
                error instanceof TypeError ||
                error.message.includes("Failed to fetch")
            ) {

                showMessage(
                    "Cannot connect to NextTurn server. Please try again.",
                    "error"
                );

            } else {

                showMessage(
                    error.message,
                    "error"
                );
            }

        } finally {

            loginBtn.disabled = false;

            if (selectedRole === "student") {
                loginBtn.textContent = "Login as Student";
            } else if (selectedRole === "staff") {
                loginBtn.textContent = "Login as Staff";
            } else {
                loginBtn.textContent = "Login as Partner";
            }
        }

    });


    function showMessage(text, type) {

        const message = document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;
    }


    function hideMessage() {

        const message = document.getElementById("message");

        message.textContent = "";

        message.className = "message";
    }

</script>

</body>
  </html>
