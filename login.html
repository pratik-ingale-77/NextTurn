<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NextTurn - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef4ff, #f8fafc);
      color: #172033;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand h1 {
      font-size: 32px;
      color: #14213d;
      margin-bottom: 5px;
    }

    .brand p {
      color: #64748b;
      font-size: 14px;
    }

    .login-box {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .role-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .role-btn {
      border: 1px solid #dbe3ef;
      background: #f8fafc;
      padding: 13px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #475569;
      transition: 0.2s;
    }

    .role-btn:hover {
      border-color: #2563eb;
    }

    .role-btn.active {
      background: #14213d;
      color: white;
      border-color: #14213d;
    }

    .role-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 20px;
    }

    .login-title h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .login-title p {
      color: #64748b;
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #dbe3ef;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .login-button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .login-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .note {
      background: #f1f5f9;
      padding: 11px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 22px;
      }

      .role-buttons {
        gap: 7px;
      }

      .role-btn {
        font-size: 12px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    <h1>⚡ NextTurn</h1>
    <p>College Canteen • Smart Ordering System</p>
  </div>

  <div class="login-box">

    <!-- ROLE SELECTION -->

    <div class="role-buttons">

      <button
        type="button"
        class="role-btn active"
        id="studentRole"
        onclick="selectRole('student')">

        <span class="role-icon">🎓</span>
        Student

      </button>

      <button
        type="button"
        class="role-btn"
        id="staffRole"
        onclick="selectRole('staff')">

        <span class="role-icon">👨‍🍳</span>
        Staff

      </button>

      <button
        type="button"
        class="role-btn"
        id="partnerRole"
        onclick="selectRole('partner')">

        <span class="role-icon">🤝</span>
        Partner

      </button>

    </div>


    <!-- LOGIN TITLE -->

    <div class="login-title">

      <h2 id="loginHeading">
        Student Login
      </h2>

      <p id="loginDescription">
        Login to order food from your classroom.
      </p>

    </div>


    <!-- STUDENT FORM -->

    <form id="studentForm">

      <div class="form-group">

        <label for="studentEmail">
          College Gmail
        </label>

        <input
          type="email"
          id="studentEmail"
          placeholder="example@gmail.com"
          autocomplete="email"
          required>

      </div>

      <div class="form-group">

        <label for="studentPassword">
          Password
        </label>

        <input
          type="password"
          id="studentPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="login-button"
        id="studentLoginButton">

        Login as Student

      </button>

    </form>


    <!-- STAFF FORM -->

    <form
      id="staffForm"
      class="hidden">

      <div class="form-group">

        <label for="staffId">
          Staff ID
        </label>

        <input
          type="text"
          id="staffId"
          placeholder="Enter staff ID"
          required>

      </div>

      <div class="form-group">

        <label for="staffPassword">
          Password
        </label>

        <input
          type="password"
          id="staffPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="login-button"
        id="staffLoginButton">

        Login as Staff

      </button>

    </form>


    <!-- PARTNER FORM -->

    <form
      id="partnerForm"
      class="hidden">

      <div class="form-group">

        <label for="partnerId">
          Partner ID
        </label>

        <input
          type="text"
          id="partnerId"
          placeholder="Enter partner ID"
          required>

      </div>

      <div class="form-group">

        <label for="partnerPassword">
          Password
        </label>

        <input
          type="password"
          id="partnerPassword"
          placeholder="Enter password"
          autocomplete="current-password"
          required>

      </div>

      <button
        type="submit"
        class="login-button"
        id="partnerLoginButton">

        Login as Partner

      </button>

    </form>


    <div
      class="note"
      id="loginNote">

      Student accounts use college Gmail.
      Staff and partner accounts use their assigned IDs.

    </div>

    <a
      href="index.html"
      class="back">

      ← Back to Home

    </a>

  </div>

</div>


<script>

  // ==========================================
  // NEXTTURN BACKEND
  // ==========================================

  const API_BASE_URL =
    "http://localhost:8080/api";


  // ==========================================
  // ROLE SELECTION
  // ==========================================

  let selectedRole = "student";


  function selectRole(role) {

    selectedRole = role;

    const studentRole =
      document.getElementById("studentRole");

    const staffRole =
      document.getElementById("staffRole");

    const partnerRole =
      document.getElementById("partnerRole");

    const studentForm =
      document.getElementById("studentForm");

    const staffForm =
      document.getElementById("staffForm");

    const partnerForm =
      document.getElementById("partnerForm");

    const heading =
      document.getElementById("loginHeading");

    const description =
      document.getElementById("loginDescription");

    const note =
      document.getElementById("loginNote");


    studentRole.classList.remove("active");
    staffRole.classList.remove("active");
    partnerRole.classList.remove("active");

    studentForm.classList.add("hidden");
    staffForm.classList.add("hidden");
    partnerForm.classList.add("hidden");


    if (role === "student") {

      studentRole.classList.add("active");
      studentForm.classList.remove("hidden");

      heading.textContent =
        "Student Login";

      description.textContent =
        "Login to order food from your classroom.";

      note.textContent =
        "Student accounts use college Gmail.";

    }


    else if (role === "staff") {

      staffRole.classList.add("active");
      staffForm.classList.remove("hidden");

      heading.textContent =
        "Staff Login";

      description.textContent =
        "Manage orders, payments, tokens and food.";

      note.textContent =
        "Staff accounts use their assigned Staff ID.";

    }


    else if (role === "partner") {

      partnerRole.classList.add("active");
      partnerForm.classList.remove("hidden");

      heading.textContent =
        "Partner Login";

      description.textContent =
        "View canteen business and revenue information.";

      note.textContent =
        "Partner accounts are private and are not visible to students.";

    }

  }


  // ==========================================
  // BUTTON LOADING STATE
  // ==========================================

  function setLoading(button, loading, text) {

    if (loading) {

      button.disabled = true;
      button.textContent = "Logging in...";

    } else {

      button.disabled = false;
      button.textContent = text;

    }

  }


  // ==========================================
  // STUDENT LOGIN
  // ==========================================

  document
    .getElementById("studentForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const email =
          document
            .getElementById("studentEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("studentPassword")
            .value
            .trim();

        const button =
          document.getElementById(
            "studentLoginButton"
          );


        if (!email || !password) {

          alert(
            "Please enter Gmail and password."
          );

          return;
        }


        if (!email.includes("@")) {

          alert(
            "Please enter a valid Gmail address."
          );

          return;
        }


        setLoading(
          button,
          true,
          "Login as Student"
        );


        try {

          const response =
            await fetch(
              `${API_BASE_URL}/student-login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email: email,
                  password: password
                })
              }
            );


          if (response.status === 401) {

            alert(
              "Invalid Gmail or password."
            );

            setLoading(
              button,
              false,
              "Login as Student"
            );

            return;
          }


          if (!response.ok) {

            alert(
              "Student login failed. Please try again."
            );

            setLoading(
              button,
              false,
              "Login as Student"
            );

            return;
          }


          const student =
            await response.json();


          localStorage.setItem(
            "nextTurnUserRole",
            "student"
          );

          localStorage.setItem(
            "nextTurnStudentEmail",
            student.email || email
          );

          localStorage.setItem(
            "nextTurnStudentId",
            student.studentId || ""
          );

          localStorage.setItem(
            "nextTurnStudentName",
            student.fullName || ""
          );


          window.location.href =
            "student.html";


        } catch (error) {

          console.error(
            "Student login error:",
            error
          );

          alert(
            "Cannot connect to NextTurn backend. Make sure Spring Boot is running on port 8080."
          );

          setLoading(
            button,
            false,
            "Login as Student"
          );

        }

      }
    );


  // ==========================================
  // STAFF LOGIN
  // ==========================================

  document
    .getElementById("staffForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const id =
          document
            .getElementById("staffId")
            .value
            .trim();

        const password =
          document
            .getElementById("staffPassword")
            .value
            .trim();

        const button =
          document.getElementById(
            "staffLoginButton"
          );


        if (!id || !password) {

          alert(
            "Please enter Staff ID and password."
          );

          return;
        }


        setLoading(
          button,
          true,
          "Login as Staff"
        );


        try {

          const response =
            await fetch(
              `${API_BASE_URL}/staff-login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  staffId: id,
                  password: password
                })
              }
            );


          if (response.status === 401) {

            alert(
              "Invalid Staff ID or password."
            );

            setLoading(
              button,
              false,
              "Login as Staff"
            );

            return;
          }


          if (!response.ok) {

            alert(
              "Staff login failed. Please try again."
            );

            setLoading(
              button,
              false,
              "Login as Staff"
            );

            return;
          }


          const staff =
            await response.json();


          localStorage.setItem(
            "nextTurnUserRole",
            "staff"
          );

          localStorage.setItem(
            "nextTurnStaffId",
            staff.staffId || id
          );

          localStorage.setItem(
            "nextTurnStaffName",
            staff.fullName || ""
          );


          window.location.href =
            "staff.html";


        } catch (error) {

          console.error(
            "Staff login error:",
            error
          );

          alert(
            "Cannot connect to NextTurn backend. Make sure Spring Boot is running on port 8080."
          );

          setLoading(
            button,
            false,
            "Login as Staff"
          );

        }

      }
    );


  // ==========================================
  // PARTNER LOGIN
  // ==========================================

  document
    .getElementById("partnerForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const id =
          document
            .getElementById("partnerId")
            .value
            .trim();

        const password =
          document
            .getElementById("partnerPassword")
            .value
            .trim();

        const button =
          document.getElementById(
            "partnerLoginButton"
          );


        if (!id || !password) {

          alert(
            "Please enter Partner ID and password."
          );

          return;
        }


        setLoading(
          button,
          true,
          "Login as Partner"
        );


        try {

          const response =
            await fetch(
              `${API_BASE_URL}/partner-login`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  partnerId: id,
                  password: password
                })
              }
            );


          if (response.status === 401) {

            alert(
              "Invalid Partner ID or password."
            );

            setLoading(
              button,
              false,
              "Login as Partner"
            );

            return;
          }


          if (!response.ok) {

            alert(
              "Partner login failed. Please try again."
            );

            setLoading(
              button,
              false,
              "Login as Partner"
            );

            return;
          }


          const partner =
            await response.json();


          localStorage.setItem(
            "nextTurnUserRole",
            "partner"
          );

          localStorage.setItem(
            "nextTurnPartnerId",
            partner.partnerId || id
          );

          localStorage.setItem(
            "nextTurnPartnerName",
            partner.fullName || ""
          );


          window.location.href =
            "partner.html";


        } catch (error) {

          console.error(
            "Partner login error:",
            error
          );

          alert(
            "Cannot connect to NextTurn backend. Make sure Spring Boot is running on port 8080."
          );

          setLoading(
            button,
            false,
            "Login as Partner"
          );

        }

      }
    );

</script>

</body>
  </html>
