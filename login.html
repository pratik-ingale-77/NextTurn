<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NextTurn - Account Login</title>

<link rel="stylesheet" href="styles.css">

<style>

* {
    box-sizing: border-box;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top left,
            rgba(212,175,55,0.12),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(212,175,55,0.06),
            transparent 35%
        ),
        #080808;

    color: #f5f5f5;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

}


.login-wrapper {

    width: 100%;

    max-width: 440px;

}


.brand-area {

    text-align: center;

    margin-bottom: 25px;

}


.brand {

    font-size: 34px;

    font-weight: 900;

    letter-spacing: -1px;

    color: #D4AF37;

    margin-bottom: 8px;

}


.tagline {

    color: #858585;

    font-size: 14px;

}


.login-card {

    background:
        linear-gradient(
            145deg,
            #151515,
            #0d0d0d
        );

    border: 1px solid
        rgba(212,175,55,0.24);

    border-radius: 24px;

    padding: 30px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,0.55);

}


.welcome {

    margin-bottom: 24px;

}


.welcome h1 {

    font-size: 25px;

    margin-bottom: 7px;

    color: #f5f5f5;

}


.welcome p {

    color: #888;

    font-size: 14px;

    line-height: 1.5;

}


.role-title {

    font-size: 13px;

    color: #999;

    margin-bottom: 10px;

    font-weight: 600;

}


.roles {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 8px;

    margin-bottom: 23px;

}


.role-btn {

    border: 1px solid #292929;

    background: #0b0b0b;

    color: #aaa;

    border-radius: 11px;

    padding: 12px 6px;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s ease;

}


.role-btn:hover {

    border-color:
        rgba(212,175,55,0.5);

    color: #F4D77D;

}


.role-btn.active {

    background:
        linear-gradient(
            135deg,
            #D4AF37,
            #F4D77D
        );

    color: #090909;

    border-color: #D4AF37;

    box-shadow:
        0 7px 20px
        rgba(212,175,55,0.14);

}


.form-group {

    margin-bottom: 17px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    color: #d5d5d5;

    font-weight: 600;

}


.form-group input {

    width: 100%;

    padding: 14px 15px;

    background: #090909;

    border: 1px solid #292929;

    border-radius: 11px;

    color: #f5f5f5;

    font-size: 15px;

    outline: none;

    transition: 0.2s ease;

}


.form-group input::placeholder {

    color: #606060;

}


.form-group input:focus {

    border-color: #D4AF37;

    box-shadow:
        0 0 0 3px
        rgba(212,175,55,0.08);

}


.login-btn {

    width: 100%;

    padding: 15px;

    margin-top: 4px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #D4AF37,
            #F4D77D
        );

    color: #090909;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    transition: 0.2s ease;

}


.login-btn:hover {

    transform: translateY(-1px);

    box-shadow:
        0 12px 28px
        rgba(212,175,55,0.18);

}


.login-btn:disabled {

    opacity: 0.55;

    cursor: not-allowed;

    transform: none;

}


.message {

    display: none;

    margin-top: 15px;

    padding: 12px;

    border-radius: 10px;

    text-align: center;

    font-size: 13px;

    line-height: 1.4;

}


.message.success {

    display: block;

    background:
        rgba(212,175,55,0.09);

    border: 1px solid
        rgba(212,175,55,0.25);

    color: #F4D77D;

}


.message.error {

    display: block;

    background:
        rgba(180,40,40,0.10);

    border: 1px solid
        rgba(220,70,70,0.22);

    color: #ff9b9b;

}


.back-home {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: #777;

    text-decoration: none;

    font-size: 13px;

    transition: 0.2s ease;

}


.back-home:hover {

    color: #D4AF37;

}


.security-note {

    text-align: center;

    margin-top: 18px;

    color: #666;

    font-size: 11px;

    line-height: 1.5;

}


.security-note strong {

    color: #888;

}


@media (max-width: 500px) {

    body {
        padding: 14px;
    }

    .login-card {
        padding: 21px;
        border-radius: 19px;
    }

    .brand {
        font-size: 30px;
    }

    .welcome h1 {
        font-size: 23px;
    }

}


@media (max-width: 360px) {

    .roles {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="login-wrapper">


    <div class="brand-area">

        <div class="brand">
            NextTurn
        </div>

        <div class="tagline">
            Digital Canteen Ordering System
        </div>

    </div>


    <div class="login-card">


        <div class="welcome">

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to your NextTurn account
                to manage your canteen experience.
            </p>

        </div>


        <div class="role-title">
            Choose account type
        </div>


        <div class="roles">


            <button
                type="button"
                class="role-btn active"
                onclick="selectRole('student', this)"
            >
                Student
            </button>


            <button
                type="button"
                class="role-btn"
                onclick="selectRole('staff', this)"
            >
                Staff
            </button>


            <button
                type="button"
                class="role-btn"
                onclick="selectRole('partner', this)"
            >
                Partner
            </button>


        </div>


        <form id="loginForm">


            <div class="form-group">

                <label id="emailLabel">
                    College Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label>
                    NextTurn Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your NextTurn password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login as Student
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>


        <div class="security-note">

            <strong>NextTurn Account Login</strong><br>

            This is the official login page for
            the NextTurn college canteen system.

        </div>


    </div>


</div>


<script>


const API_BASE_URL =
    "https://nextturn-mgbf.onrender.com";


let selectedRole =
    "student";


function selectRole(role, button) {


    selectedRole =
        role;


    document
        .querySelectorAll(".role-btn")
        .forEach(function(btn) {

            btn.classList.remove(
                "active"
            );

        });


    button.classList.add(
        "active"
    );


    const emailLabel =
        document.getElementById(
            "emailLabel"
        );


    const emailInput =
        document.getElementById(
            "email"
        );


    const loginBtn =
        document.getElementById(
            "loginBtn"
        );


    if (role === "student") {


        emailLabel.textContent =
            "College Email";


        emailInput.type =
            "email";


        emailInput.placeholder =
            "Enter your registered email";


        loginBtn.textContent =
            "Login as Student";


    }


    else if (role === "staff") {


        emailLabel.textContent =
            "Staff ID";


        emailInput.type =
            "text";


        emailInput.placeholder =
            "Enter Staff ID";


        loginBtn.textContent =
            "Login as Staff";


    }


    else {


        emailLabel.textContent =
            "Partner ID";


        emailInput.type =
            "text";


        emailInput.placeholder =
            "Enter Partner ID";


        loginBtn.textContent =
            "Login as Partner";

    }


    emailInput.value = "";

    document.getElementById(
        "password"
    ).value = "";


    hideMessage();

}


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();


            const loginValue =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const loginBtn =
                document.getElementById(
                    "loginBtn"
                );


            hideMessage();


            if (
                !loginValue ||
                !password
            ) {

                showMessage(
                    "Please enter your login details.",
                    "error"
                );

                return;

            }


            let endpoint = "";

            let requestBody = {};


            if (
                selectedRole ===
                "student"
            ) {


                endpoint =
                    "/api/student-login";


                requestBody = {

                    email:
                        loginValue,

                    password:
                        password

                };

            }


            else if (
                selectedRole ===
                "staff"
            ) {


                endpoint =
                    "/api/staff-login";


                requestBody = {

                    staffId:
                        loginValue,

                    password:
                        password

                };

            }


            else {


                endpoint =
                    "/api/partner-login";


                requestBody = {

                    partnerId:
                        loginValue,

                    password:
                        password

                };

            }


            loginBtn.disabled =
                true;


            loginBtn.textContent =
                "Logging in...";


            try {


                const response =
                    await fetch(
                        API_BASE_URL +
                        endpoint,
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify(
                                    requestBody
                                )

                        }
                    );


                let data = {};


                try {

                    data =
                        await response.json();

                }

                catch {

                    data = {};

                }


                if (!response.ok) {

                    throw new Error(

                        data.message ||
                        data.error ||
                        "Invalid login details."

                    );

                }


                localStorage.setItem(
                    "nextTurnRole",
                    selectedRole
                );


                localStorage.setItem(
                    "nextTurnUser",
                    JSON.stringify(data)
                );


                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );


                setTimeout(
                    function() {


                        if (
                            selectedRole ===
                            "student"
                        ) {

                            window.location.href =
                                "student.html";

                        }


                        else if (
                            selectedRole ===
                            "staff"
                        ) {

                            window.location.href =
                                "staff.html";

                        }


                        else {

                            window.location.href =
                                "partner.html";

                        }


                    },
                    700
                );


            }


            catch (error) {


                console.error(
                    "Login error:",
                    error
                );


                if (
                    error instanceof
                    TypeError ||
                    error.message.includes(
                        "Failed to fetch"
                    )
                ) {


                    showMessage(
                        "Cannot connect to NextTurn server. Please try again.",
                        "error"
                    );


                }


                else {


                    showMessage(
                        error.message,
                        "error"
                    );

                }

            }


            finally {


                loginBtn.disabled =
                    false;


                if (
                    selectedRole ===
                    "student"
                ) {

                    loginBtn.textContent =
                        "Login as Student";

                }


                else if (
                    selectedRole ===
                    "staff"
                ) {

                    loginBtn.textContent =
                        "Login as Staff";

                }


                else {

                    loginBtn.textContent =
                        "Login as Partner";

                }

            }

        }
    );


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " + type;

}


function hideMessage() {

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        "";


    message.className =
        "message";

}


</script>

</body>

</html>
