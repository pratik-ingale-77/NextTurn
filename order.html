<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextTurn - Order Food</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;
        }

        /* HEADER */

        header {
            background: #082b5c;
            color: white;
            padding: 16px 22px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 23px;
        }

        header p {
            font-size: 12px;
            opacity: .85;
            margin-top: 3px;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: white;
            color: #082b5c;
            border: none;

            padding: 9px 13px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .cart-button {
            position: relative;
        }

        .cart-count {
            position: absolute;

            top: -7px;
            right: -7px;

            background: #e53935;
            color: white;

            min-width: 20px;
            height: 20px;

            border-radius: 50%;

            font-size: 11px;

            display: none;

            align-items: center;
            justify-content: center;
        }


        /* MAIN */

        .container {
            max-width: 1150px;
            margin: auto;
            padding: 25px 20px;
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            color: #082b5c;
            margin-bottom: 5px;
        }

        .page-title p {
            color: #777;
        }


        /* CATEGORY */

        .categories {
            display: flex;
            gap: 10px;

            overflow-x: auto;

            padding-bottom: 12px;

            margin-bottom: 20px;
        }

        .category-btn {
            flex-shrink: 0;

            background: white;
            color: #082b5c;

            border: 1px solid #ccd5e0;

            padding: 9px 15px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;
        }

        .category-btn.active {
            background: #082b5c;
            color: white;
            border-color: #082b5c;
        }


        /* FOOD GRID */

        .food-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }


        /* FOOD CARD */

        .food-card {
            background: white;

            border-radius: 14px;

            padding: 18px;

            box-shadow:
                0 3px 12px rgba(0,0,0,.07);

            display: flex;
            flex-direction: column;

            min-height: 220px;

            transition: .2s;
        }

        .food-card:hover {
            transform: translateY(-2px);
            box-shadow:
                0 7px 18px rgba(0,0,0,.10);
        }

        .food-icon {
            width: 55px;
            height: 55px;

            border-radius: 12px;

            background: #eef4fb;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            margin-bottom: 12px;
        }

        .food-card h3 {
            color: #082b5c;
            margin-bottom: 5px;
        }

        .category {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
            color: #172033;

            margin-bottom: 4px;
        }

        .service {
            font-size: 11px;
            color: #888;

            margin-bottom: 14px;
        }

        .food-bottom {
            margin-top: auto;
        }


        /* ADD BUTTON */

        .add-btn {
            width: 100%;

            background: #082b5c;
            color: white;

            border: none;

            padding: 11px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .add-btn:hover {
            background: #0b3978;
        }

        .add-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }


        /* ADDED */

        .added {
            background: #2e7d32 !important;
        }


        /* OUT OF STOCK */

        .out-stock {
            background: #fbe9e7;

            color: #c62828;

            padding: 9px;

            text-align: center;

            border-radius: 8px;

            font-size: 13px;

            font-weight: bold;
        }


        /* MOBILE */

        @media(max-width: 900px) {

            .food-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }


        @media(max-width: 600px) {

            header {
                padding: 13px 14px;
            }

            header h1 {
                font-size: 19px;
            }

            .container {
                padding: 18px 12px;
            }

            .food-grid {
                grid-template-columns: 1fr;
            }

            .header-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

        }

    </style>
</head>


<body>


<!-- HEADER -->

<header>

    <div>

        <h1>⚡ NextTurn</h1>

        <p>
            🍔 Order Food • College Canteen
        </p>

    </div>


    <div class="header-buttons">

        <button
            class="header-btn"
            onclick="goDashboard()">

            ← Dashboard

        </button>


        <button
            class="header-btn cart-button"
            onclick="goCart()">

            🛒 Cart

            <span
                id="cartCount"
                class="cart-count">

                0

            </span>

        </button>

    </div>

</header>


<!-- MAIN -->

<div class="container">


    <div class="page-title">

        <h2>
            🍔 Order Food
        </h2>

        <p>
            Select your food and add it to your cart.
            Your cart is available separately from the dashboard.
        </p>

    </div>


    <!-- CATEGORIES -->

    <div
        id="categories"
        class="categories">

    </div>


    <!-- FOOD -->

    <div
        id="foodGrid"
        class="food-grid">

    </div>


</div>


<script>

/* =====================================================
   MENU
===================================================== */

const menu = [

    {
        id: 1,
        name: "Chips",
        category: "Snacks",
        price: 10
    },

    {
        id: 2,
        name: "Kurkure",
        category: "Snacks",
        price: 10
    },

    {
        id: 3,
        name: "Samosa",
        category: "Snacks",
        price: 15
    },

    {
        id: 4,
        name: "Vada Pav",
        category: "Snacks",
        price: 20
    },


    {
        id: 5,
        name: "Veg Sandwich",
        category: "Fast Food",
        price: 40
    },

    {
        id: 6,
        name: "Cheese Sandwich",
        category: "Fast Food",
        price: 50
    },

    {
        id: 7,
        name: "Veg Burger",
        category: "Fast Food",
        price: 60
    },

    {
        id: 8,
        name: "French Fries",
        category: "Fast Food",
        price: 50
    },

    {
        id: 9,
        name: "Veg Roll",
        category: "Fast Food",
        price: 45
    },


    {
        id: 10,
        name: "Veg Biryani",
        category: "Meals",
        price: 80
    },

    {
        id: 11,
        name: "Veg Thali",
        category: "Meals",
        price: 90
    },

    {
        id: 12,
        name: "Misal Pav",
        category: "Meals",
        price: 45
    },


    {
        id: 13,
        name: "Frooti",
        category: "Drinks",
        price: 20
    },

    {
        id: 14,
        name: "Masala Chai",
        category: "Drinks",
        price: 15
    },

    {
        id: 15,
        name: "Cold Coffee",
        category: "Drinks",
        price: 40
    },

    {
        id: 16,
        name: "Lemon Juice",
        category: "Drinks",
        price: 25
    },

    {
        id: 17,
        name: "Soft Drink",
        category: "Drinks",
        price: 30
    }

];


/* =====================================================
   CART
===================================================== */

let cart = [];


try {

    cart =
        JSON.parse(
            localStorage.getItem(
                "nextTurnCart"
            ) || "[]"
        );

} catch (error) {

    cart = [];

}


/* =====================================================
   CATEGORY
===================================================== */

let currentCategory = "All";


const categoryList = [
    "All",
    "Snacks",
    "Fast Food",
    "Meals",
    "Drinks"
];


function renderCategories() {

    const container =
        document.getElementById(
            "categories"
        );


    container.innerHTML = "";


    categoryList.forEach(
        category => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn" +
                (
                    currentCategory === category
                        ? " active"
                        : ""
                );


            button.textContent =
                category;


            button.onclick =
                function() {

                    currentCategory =
                        category;

                    renderCategories();

                    renderFood();

                };


            container.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   FOOD ICON
===================================================== */

function getFoodIcon(name) {

    const lower =
        name.toLowerCase();


    if (
        lower.includes("chips") ||
        lower.includes("kurkure")
    ) {
        return "🥔";
    }


    if (
        lower.includes("samosa")
    ) {
        return "🥟";
    }


    if (
        lower.includes("vada")
    ) {
        return "🍔";
    }


    if (
        lower.includes("sandwich")
    ) {
        return "🥪";
    }


    if (
        lower.includes("burger")
    ) {
        return "🍔";
    }


    if (
        lower.includes("fries")
    ) {
        return "🍟";
    }


    if (
        lower.includes("roll")
    ) {
        return "🌯";
    }


    if (
        lower.includes("biryani")
    ) {
        return "🍛";
    }


    if (
        lower.includes("thali")
    ) {
        return "🍱";
    }


    if (
        lower.includes("misal")
    ) {
        return "🍲";
    }


    if (
        lower.includes("chai")
    ) {
        return "☕";
    }


    if (
        lower.includes("coffee")
    ) {
        return "🥤";
    }


    if (
        lower.includes("juice")
    ) {
        return "🧃";
    }


    if (
        lower.includes("frooti") ||
        lower.includes("drink")
    ) {
        return "🥤";
    }


    return "🍽️";
}


/* =====================================================
   SERVICE CHARGE
===================================================== */

function getServiceCharge(price) {

    return Number(price) <= 20
        ? 0.50
        : 1.00;

}


/* =====================================================
   FOOD AVAILABLE
===================================================== */

function isItemAvailable(id) {

    /*
       Keep compatibility with the current
       local stock system.

       If staff has marked an item unavailable,
       it is stored here.
    */

    const unavailable =
        JSON.parse(
            localStorage.getItem(
                "nextTurnUnavailableItems"
            ) || "[]"
        );


    return !unavailable.includes(
        Number(id)
    );

}


/* =====================================================
   RENDER FOOD
===================================================== */

function renderFood() {

    const grid =
        document.getElementById(
            "foodGrid"
        );


    grid.innerHTML = "";


    const filtered =
        currentCategory === "All"

            ? menu

            : menu.filter(
                item =>
                    item.category ===
                    currentCategory
            );


    filtered.forEach(
        item => {

            const available =
                isItemAvailable(
                    item.id
                );


            const existing =
                cart.find(
                    cartItem =>
                        Number(
                            cartItem.id
                        ) ===
                        Number(item.id)
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "food-card";


            card.innerHTML = `

                <div class="food-icon">

                    ${getFoodIcon(item.name)}

                </div>


                <h3>

                    ${escapeHTML(item.name)}

                </h3>


                <div class="category">

                    ${escapeHTML(item.category)}

                </div>


                <div class="price">

                    ₹${Number(
                        item.price
                    ).toFixed(2)}

                </div>


                <div class="service">

                    + ₹${getServiceCharge(
                        item.price
                    ).toFixed(2)}
                    service charge / quantity

                </div>


                <div class="food-bottom">

                    ${
                        !available

                        ?

                        `

                        <div class="out-stock">

                            ❌ Out of Stock

                        </div>

                        `

                        :

                        `

                        <button
                            class="add-btn ${
                                existing
                                    ? "added"
                                    : ""
                            }"
                            onclick="
                                addToCart(${item.id})
                            ">

                            ${
                                existing
                                    ? "✓ Added to Cart"
                                    : "🛒 Add to Cart"
                            }

                        </button>

                        `
                    }

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ADD TO CART
===================================================== */

function addToCart(id) {

    const item =
        menu.find(
            food =>
                Number(food.id) ===
                Number(id)
        );


    if (!item) {
        return;
    }


    if (
        !isItemAvailable(
            item.id
        )
    ) {

        alert(
            item.name +
            " is currently out of stock."
        );

        return;
    }


    const existing =
        cart.find(
            cartItem =>
                Number(
                    cartItem.id
                ) ===
                Number(item.id)
        );


    if (existing) {

        existing.quantity =
            Number(
                existing.quantity || 1
            ) + 1;

    } else {

        cart.push({

            id: item.id,

            name: item.name,

            category: item.category,

            price: item.price,

            quantity: 1

        });

    }


    saveCart();

    updateCartCount();

    renderFood();


    /*
       Small confirmation.
    */

    showAddedMessage(
        item.name
    );

}


/* =====================================================
   SAVE
===================================================== */

function saveCart() {

    localStorage.setItem(
        "nextTurnCart",
        JSON.stringify(cart)
    );

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount() {

    const count =
        cart.reduce(
            (total, item) => {

                return total +
                    Number(
                        item.quantity || 1
                    );

            },
            0
        );


    const badge =
        document.getElementById(
            "cartCount"
        );


    if (count > 0) {

        badge.textContent =
            count;

        badge.style.display =
            "flex";

    } else {

        badge.style.display =
            "none";

    }

}


/* =====================================================
   ADDED MESSAGE
===================================================== */

function showAddedMessage(name) {

    const message =
        document.createElement(
            "div"
        );


    message.textContent =
        "✓ " +
        name +
        " added to cart";


    message.style.position =
        "fixed";

    message.style.bottom =
        "25px";

    message.style.left =
        "50%";

    message.style.transform =
        "translateX(-50%)";

    message.style.background =
        "#2e7d32";

    message.style.color =
        "white";

    message.style.padding =
        "12px 18px";

    message.style.borderRadius =
        "9px";

    message.style.zIndex =
        "9999";

    message.style.fontWeight =
        "bold";

    document.body.appendChild(
        message
    );


    setTimeout(
        () => {

            message.remove();

        },
        1500
    );

}


/* =====================================================
   NAVIGATION
===================================================== */

function goCart() {

    window.location.href =
        "cart.html";

}


function goDashboard() {

    window.location.href =
        "student.html";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

renderCategories();

renderFood();

updateCartCount();

</script>

</body>
  </html>
