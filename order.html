<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NextTurn - Order Food</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #172554;
      color: white;
      padding: 17px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .back-btn {
      background: white;
      color: #172554;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .container {
      width: 92%;
      max-width: 1150px;
      margin: 28px auto;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: #64748b;
    }

    /* Categories */

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }

    .category-btn {
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      padding: 10px 17px;
      border-radius: 25px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: bold;
    }

    .category-btn.active {
      background: #172554;
      color: white;
      border-color: #172554;
    }

    /* Layout */

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 24px;
      align-items: start;
    }

    /* Menu */

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .food-card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      border: 1px solid transparent;
    }

    .food-card h3 {
      margin-bottom: 7px;
      font-size: 18px;
    }

    .food-category {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      color: #172554;
      margin-bottom: 13px;
    }

    .available {
      color: #15803d;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .unavailable {
      color: #dc2626;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .add-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Cart */

    .cart {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.07);
      position: sticky;
      top: 20px;
    }

    .cart h2 {
      margin-bottom: 18px;
      font-size: 21px;
    }

    .cart-empty {
      background: #f8fafc;
      padding: 18px;
      text-align: center;
      border-radius: 9px;
      color: #64748b;
      margin-bottom: 15px;
    }

    .cart-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 13px 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .cart-item-name {
      font-weight: bold;
    }

    .cart-item-price {
      color: #172554;
      font-weight: bold;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .quantity-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .quantity {
      min-width: 20px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      margin-left: auto;
      border: none;
      background: none;
      color: #dc2626;
      cursor: pointer;
      font-size: 13px;
    }

    .summary {
      border-top: 1px solid #e2e8f0;
      margin-top: 15px;
      padding-top: 15px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #475569;
    }

    .summary-row.total {
      color: #172033;
      font-size: 18px;
      font-weight: bold;
      padding-top: 8px;
    }

    .payment-btn {
      width: 100%;
      border: none;
      background: #16a34a;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .payment-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    .rule {
      margin-top: 15px;
      background: #eff6ff;
      color: #1e3a8a;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Mobile */

    @media (max-width: 850px) {

      .main-layout {
        grid-template-columns: 1fr;
      }

      .cart {
        position: static;
      }

    }

    @media (max-width: 550px) {

      .container {
        width: 94%;
      }

      .page-title h1 {
        font-size: 23px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .cart {
        padding: 17px;
      }

    }
  </style>
</head>

<body>

<header>

  <div>
    <div class="logo">⚡ NextTurn</div>
    <div class="subtitle">College Canteen • Order Food</div>
  </div>

  <button class="back-btn" onclick="goBack()">
    ← Dashboard
  </button>

</header>


<div class="container">

  <div class="page-title">

    <h1>🍔 College Canteen Menu</h1>

    <p>
      Choose your food and place your order from the classroom.
    </p>

  </div>


  <!-- Categories -->

  <div class="categories">

    <button
      class="category-btn active"
      onclick="filterCategory('All', this)">
      All
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Snacks', this)">
      Snacks
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Fast Food', this)">
      Fast Food
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Meals', this)">
      Meals
    </button>

    <button
      class="category-btn"
      onclick="filterCategory('Drinks', this)">
      Drinks
    </button>

  </div>


  <div class="main-layout">

    <!-- MENU -->

    <div>

      <div
        id="menuGrid"
        class="menu-grid">
      </div>

    </div>


    <!-- CART -->

    <div class="cart">

      <h2>🛒 Your Cart</h2>

      <div id="cartContent"></div>

      <div class="summary">

        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="subtotal">₹0.00</strong>
        </div>

        <div class="summary-row">
          <span>Service Charge</span>
          <strong id="serviceCharge">₹0.00</strong>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <strong id="grandTotal">₹0.00</strong>
        </div>

      </div>


      <button
        id="paymentBtn"
        class="payment-btn"
        onclick="proceedToPayment()"
        disabled>
        Proceed to Payment
      </button>


      <div class="rule">

        <strong>Service Charge Rule</strong><br><br>

        Food price ≤ ₹20 → ₹0.50 per item<br>

        Food price &gt; ₹20 → ₹1.00 per item

      </div>

    </div>

  </div>

</div>


<!-- Load menu data -->

<script src="menu.js"></script>


<script>

  // ==========================================
  // DATA
  // ==========================================

  let selectedCategory = "All";

  let cart =
    JSON.parse(
      localStorage.getItem("nextTurnCart") || "[]"
    );


  // ==========================================
  // STOCK DATA
  // ==========================================
  //
  // Staff dashboard saves:
  // nextTurnStock
  //
  // Example:
  // {
  //   "1": true,
  //   "2": false
  // }
  //
  // true = available
  // false = out of stock
  //

  function getStockStatus(itemId) {

    const stockData =
      JSON.parse(
        localStorage.getItem("nextTurnStock") || "{}"
      );

    // If staff has never changed the item,
    // it is available by default.

    if (
      Object.prototype.hasOwnProperty.call(
        stockData,
        itemId
      )
    ) {
      return stockData[itemId];
    }

    return true;
  }


  // ==========================================
  // SAVE CART
  // ==========================================

  function saveCart() {

    localStorage.setItem(
      "nextTurnCart",
      JSON.stringify(cart)
    );

  }


  // ==========================================
  // DISPLAY MENU
  // ==========================================

  function displayMenu() {

    const grid =
      document.getElementById("menuGrid");

    grid.innerHTML = "";


    const filteredMenu =
      selectedCategory === "All"
      ? menu
      : menu.filter(
          item =>
            item.category === selectedCategory
        );


    filteredMenu.forEach(item => {

      const available =
        getStockStatus(item.id);


      const card =
        document.createElement("div");

      card.className =
        "food-card";


      card.innerHTML = `

        <h3>${item.name}</h3>

        <div class="food-category">
          ${item.category}
        </div>

        <div class="price">
          ₹${Number(item.price).toFixed(2)}
        </div>

        <div class="${available ? "available" : "unavailable"}">

          ${available
            ? "● Available"
            : "● Out of Stock"}

        </div>

        <button
          class="add-btn"
          onclick="addToCart('${item.id}')"
          ${available ? "" : "disabled"}>

          ${available
            ? "Add to Cart"
            : "Currently Unavailable"}

        </button>

      `;


      grid.appendChild(card);

    });

  }


  // ==========================================
  // CATEGORY FILTER
  // ==========================================

  function filterCategory(category, button) {

    selectedCategory =
      category;


    document
      .querySelectorAll(".category-btn")
      .forEach(btn => {

        btn.classList.remove("active");

      });


    button.classList.add("active");


    displayMenu();

  }


  // ==========================================
  // ADD TO CART
  // ==========================================

  function addToCart(itemId) {

    const item =
      menu.find(
        food =>
          String(food.id) === String(itemId)
      );


    if (!item) {
      return;
    }


    if (!getStockStatus(item.id)) {

      alert(
        item.name +
        " is currently out of stock."
      );

      return;
    }


    const existing =
      cart.find(
        cartItem =>
          String(cartItem.id) === String(item.id)
      );


    if (existing) {

      existing.quantity += 1;

    } else {

      cart.push({

        id: item.id,

        name: item.name,

        price: Number(item.price),

        category: item.category,

        quantity: 1

      });

    }


    saveCart();

    renderCart();

  }


  // ==========================================
  // CHANGE QUANTITY
  // ==========================================

  function changeQuantity(itemId, change) {

    const item =
      cart.find(
        cartItem =>
          String(cartItem.id) === String(itemId)
      );


    if (!item) {
      return;
    }


    // Don't allow adding more if staff
    // has marked the food unavailable.

    if (
      change > 0 &&
      !getStockStatus(item.id)
    ) {

      alert(
        item.name +
        " is now out of stock."
      );

      removeFromCart(item.id);

      return;
    }


    item.quantity += change;


    if (item.quantity <= 0) {

      removeFromCart(item.id);

      return;

    }


    saveCart();

    renderCart();

  }


  // ==========================================
  // REMOVE ITEM
  // ==========================================

  function removeFromCart(itemId) {

    cart =
      cart.filter(
        item =>
          String(item.id) !== String(itemId)
      );


    saveCart();

    renderCart();

  }


  // ==========================================
  // CALCULATE SERVICE CHARGE
  // ==========================================

  function calculateServiceCharge() {

    let charge = 0;


    cart.forEach(item => {

      const itemCharge =
        Number(
          getServiceCharge(item.price)
        );


      charge +=
        itemCharge * item.quantity;

    });


    return charge;

  }


  // ==========================================
  // CALCULATE SUBTOTAL
  // ==========================================

  function calculateSubtotal() {

    let subtotal = 0;


    cart.forEach(item => {

      subtotal +=
        Number(item.price) *
        Number(item.quantity);

    });


    return subtotal;

  }


  // ==========================================
  // RENDER CART
  // ==========================================

  function renderCart() {

    const content =
      document.getElementById("cartContent");


    // Remove items that became
    // unavailable while in the cart.

    cart =
      cart.filter(
        item =>
          getStockStatus(item.id)
      );


    saveCart();


    if (cart.length === 0) {

      content.innerHTML = `

        <div class="cart-empty">

          Your cart is empty.

          <br><br>

          Add food items from the menu.

        </div>

      `;

    } else {

      content.innerHTML =
        cart.map(item => `

          <div class="cart-item">

            <div class="cart-item-top">

              <span class="cart-item-name">
                ${item.name}
              </span>

              <span class="cart-item-price">
                ₹${(
                  Number(item.price) *
                  Number(item.quantity)
                ).toFixed(2)}
              </span>

            </div>


            <div class="quantity-row">

              <button
                class="quantity-btn"
                onclick="changeQuantity('${item.id}', -1)">
                −
              </button>


              <span class="quantity">
                ${item.quantity}
              </span>


              <button
                class="quantity-btn"
                onclick="changeQuantity('${item.id}', 1)">
                +
              </button>


              <button
                class="remove-btn"
                onclick="removeFromCart('${item.id}')">
                Remove
              </button>

            </div>

          </div>

        `).join("");

    }


    const subtotal =
      calculateSubtotal();


    const serviceCharge =
      calculateServiceCharge();


    const grandTotal =
      subtotal + serviceCharge;


    document.getElementById("subtotal").textContent =
      "₹" + subtotal.toFixed(2);


    document.getElementById("serviceCharge").textContent =
      "₹" + serviceCharge.toFixed(2);


    document.getElementById("grandTotal").textContent =
      "₹" + grandTotal.toFixed(2);


    document.getElementById("paymentBtn").disabled =
      cart.length === 0;

  }


  // ==========================================
  // PROCEED TO PAYMENT
  // ==========================================

  function proceedToPayment() {

    if (cart.length === 0) {

      alert(
        "Please add at least one food item."
      );

      return;
    }


    // Final stock check before payment.

    const unavailable =
      cart.find(
        item =>
          !getStockStatus(item.id)
      );


    if (unavailable) {

      alert(
        unavailable.name +
        " is currently out of stock. " +
        "Please remove it from your cart."
      );

      renderCart();

      return;
    }


    saveCart();

    window.location.href =
      "payment.html";

  }


  // ==========================================
  // BACK TO DASHBOARD
  // ==========================================

  function goBack() {

    window.location.href =
      "student.html";

  }


  // ==========================================
  // START
  // ==========================================

  displayMenu();

  renderCart();


  // Refresh stock automatically
  // when the student returns to this tab.

  window.addEventListener(
    "storage",
    function(event) {

      if (
        event.key === "nextTurnStock"
      ) {

        displayMenu();

        renderCart();

      }

    }
  );


  window.addEventListener(
    "focus",
    function() {

      displayMenu();

      renderCart();

    }
  );

</script>

</body>
    </html>
