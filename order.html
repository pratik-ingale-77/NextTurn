<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NextTurn - Order Food</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .order-page {
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .order-hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 42px 20px 25px;
        }

        .order-hero h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: -1px;
        }

        .order-hero h1 span {
            color: #D4AF37;
        }

        .order-hero p {
            margin: 10px 0 0;
            color: #9A9A9A;
            font-size: 15px;
        }

        /* FOOD TYPE */

        .food-type-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px;
        }

        .food-type-tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .food-type-btn {
            border: 1px solid rgba(212, 175, 55, 0.25);
            background: #111111;
            color: #D0D0D0;
            padding: 13px 22px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.25s ease;
        }

        .food-type-btn:hover {
            border-color: #D4AF37;
            color: #F4D77D;
            transform: translateY(-1px);
        }

        .food-type-btn.active {
            background: #D4AF37;
            color: #080808;
            border-color: #D4AF37;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.15);
        }

        /* CATEGORY */

        .category-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 25px;
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex: 0 0 auto;
            border: 1px solid rgba(212, 175, 55, 0.18);
            background: #111111;
            color: #AFAFAF;
            padding: 10px 17px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.25s ease;
            font-weight: 600;
        }

        .category-btn:hover {
            color: #F4D77D;
            border-color: rgba(212, 175, 55, 0.5);
        }

        .category-btn.active {
            color: #080808;
            background: #D4AF37;
            border-color: #D4AF37;
        }

        /* MENU */

        .menu-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .food-card {
            position: relative;
            background: linear-gradient(145deg, #151515, #0D0D0D);
            border: 1px solid rgba(212, 175, 55, 0.16);
            border-radius: 20px;
            padding: 20px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: 0.25s ease;
            overflow: hidden;
        }

        .food-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #D4AF37,
                transparent
            );
            opacity: 0.7;
        }

        .food-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.55);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .food-icon {
            width: 55px;
            height: 55px;
            border-radius: 16px;
            background: #0A0A0A;
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .food-type-label {
            display: inline-block;
            width: fit-content;
            padding: 4px 8px;
            border-radius: 7px;
            background: rgba(212, 175, 55, 0.08);
            color: #D4AF37;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.7px;
            margin-bottom: 8px;
        }

        .food-name {
            margin: 0;
            color: #F5F5F5;
            font-size: 18px;
            font-weight: 750;
        }

        .food-category {
            margin: 5px 0 0;
            color: #777777;
            font-size: 12px;
        }

        .food-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 20px;
        }

        .food-price {
            color: #F4D77D;
            font-size: 19px;
            font-weight: 800;
        }

        .add-food-btn {
            border: none;
            background: #D4AF37;
            color: #080808;
            padding: 10px 15px;
            border-radius: 11px;
            cursor: pointer;
            font-weight: 800;
            transition: 0.2s ease;
        }

        .add-food-btn:hover {
            background: #F4D77D;
            transform: scale(1.03);
        }

        .add-food-btn:active {
            transform: scale(0.97);
        }

        .unavailable {
            opacity: 0.5;
        }

        .unavailable .add-food-btn {
            background: #333333;
            color: #888888;
            cursor: not-allowed;
        }

        .empty-menu {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #111111;
            border: 1px solid rgba(212, 175, 55, 0.12);
            border-radius: 20px;
            color: #888888;
        }

        /* FLOATING CART */

        .floating-cart {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(92%, 500px);
        }

        .floating-cart button {
            width: 100%;
            border: 1px solid #F4D77D;
            background: #D4AF37;
            color: #080808;
            padding: 16px 20px;
            border-radius: 17px;
            font-size: 16px;
            font-weight: 850;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
            transition: 0.2s ease;
        }

        .floating-cart button:hover {
            background: #F4D77D;
            transform: translateY(-2px);
        }

        .cart-total {
            margin-left: 5px;
        }

        /* HEADER */

        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(8, 8, 8, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.12);
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            color: #F5F5F5;
            font-size: 22px;
            font-weight: 850;
            letter-spacing: -0.5px;
        }

        .brand span {
            color: #F5F5F5;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .header-btn {
            border: 1px solid rgba(212, 175, 55, 0.25);
            background: #111111;
            color: #D4AF37;
            padding: 9px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .header-btn:hover {
            border-color: #D4AF37;
            color: #F4D77D;
        }

        .cart-badge {
            display: inline-flex;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: #D4AF37;
            color: #080808;
            font-size: 11px;
            font-weight: 900;
            margin-left: 4px;
        }

        /* RESPONSIVE */

        @media (max-width: 1050px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 760px) {
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 13px;
            }

            .food-card {
                padding: 16px;
                min-height: 205px;
            }

            .food-name {
                font-size: 16px;
            }

            .food-price {
                font-size: 17px;
            }

            .add-food-btn {
                padding: 9px 11px;
                font-size: 12px;
            }
        }

        @media (max-width: 470px) {
            .header-inner {
                padding: 12px 14px;
            }

            .brand {
                font-size: 19px;
            }

            .header-btn {
                padding: 8px 10px;
                font-size: 12px;
            }

            .order-hero {
                padding: 30px 14px 20px;
            }

            .food-type-section,
            .category-section,
            .menu-section {
                padding-left: 14px;
                padding-right: 14px;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .food-card {
                min-height: 190px;
            }

            .food-type-btn {
                flex: 1;
                text-align: center;
                padding: 12px 10px;
            }

            .floating-cart {
                bottom: 14px;
                width: calc(100% - 28px);
            }
        }
    </style>
</head>

<body>

<div class="order-page">

    <!-- HEADER -->
    <header class="top-header">
        <div class="header-inner">

            <div class="brand">
                NextTurn
            </div>

            <div class="header-actions">

                <button class="header-btn" onclick="goToDashboard()">
                    Dashboard
                </button>

                <button class="header-btn" onclick="goToCart()">
                    Cart
                    <span id="cartBadge" class="cart-badge">0</span>
                </button>

            </div>
        </div>
    </header>


    <!-- HERO -->
    <section class="order-hero">

        <h1>
            Order Your <span>Food</span>
        </h1>

        <p>
            Choose your food type, select your favourite items and add them to your cart.
        </p>

    </section>


    <!-- VEG / NON-VEG -->
    <section class="food-type-section">

        <div class="food-type-tabs">

            <button
                class="food-type-btn active"
                data-type="All"
                onclick="selectFoodType('All')">
                🍽️ All Food
            </button>

            <button
                class="food-type-btn"
                data-type="Veg"
                onclick="selectFoodType('Veg')">
                🥗 Veg Food
            </button>

            <button
                class="food-type-btn"
                data-type="Non-Veg"
                onclick="selectFoodType('Non-Veg')">
                🍗 Non-Veg Food
            </button>

        </div>

    </section>


    <!-- CATEGORIES -->
    <section class="category-section">

        <div class="category-bar">

            <button
                class="category-btn active"
                onclick="filterMenu('All', this)">
                All
            </button>

            <button
                class="category-btn"
                onclick="filterMenu('Snacks', this)">
                Snacks
            </button>

            <button
                class="category-btn"
                onclick="filterMenu('Fast Food', this)">
                Fast Food
            </button>

            <button
                class="category-btn"
                onclick="filterMenu('Meals', this)">
                Meals
            </button>

            <button
                class="category-btn"
                onclick="filterMenu('Drinks', this)">
                Drinks
            </button>

        </div>

    </section>


    <!-- MENU -->
    <section class="menu-section">

        <div id="menuGrid" class="menu-grid"></div>

    </section>


    <!-- FLOATING CART -->
    <div class="floating-cart">

        <button onclick="goToCart()">
            🛒 View Cart
            <span id="cartText">(0 items)</span>
            <span id="cartTotal" class="cart-total">₹0.00</span>
        </button>

    </div>

</div>


<script>
    /*
     * NEXTTURN FOOD MENU
     * Demo menu data.
     * Backend/API logic remains untouched.
     */

    const menu = [

        /* VEG - SNACKS */

        {

        /* VEG - FAST FOOD */

        {

        },

        {

        },


        /* VEG - MEALS */

        {
            name: "Veg Biryani",

            available: true
        },

        {

            price: 90,

        },

        {

        },


        /* VEG - DRINKS */

        {
            name: "Frooti",
            price: 20,
            category: "Drinks",
            type: "Veg",
            icon: "🧃",
            available: true
        },

        {
            name: "Masala Chai",
            price: 15,
            category: "Drinks",
            type: "Veg",
            icon: "☕",
            available: true
        },

        {
            name: "Cold Coffee",
            price: 40,
            category: "Drinks",
            type: "Veg",
            icon: "🥤",
            available: true
        },

        {
            name: "Lemon Juice",
            price: 25,
            category: "Drinks",
            type: "Veg",
            icon: "🍋",
            available: true
        },

        {
            name: "Soft Drink",
            price: 30,
            category: "Drinks",
            type: "Veg",
            icon: "🥤",
            available: true
        },


        /* NON-VEG - FAST FOOD */

        {
            name: "Chicken Sandwich",
            price: 70,
            category: "Fast Food",
            type: "Non-Veg",
            icon: "🥪",
            available: true
        },

        {
            name: "Chicken Burger",
            price: 90,
            category: "Fast Food",
            type: "Non-Veg",
            icon: "🍔",
            available: true
        },

        {
            name: "Chicken Roll",
            price: 80,
            category: "Fast Food",
            type: "Non-Veg",
            icon: "🌯",
            available: true
        },


        /* NON-VEG - MEALS */

        {
            name: "Chicken Biryani",
            price: 120,
            category: "Meals",
            type: "Non-Veg",
            icon: "🍗",
            available: true
        },

        {
            name: "Chicken Thali",
            price: 130,
            category: "Meals",
            type: "Non-Veg",
            icon: "🍛",
            available: true
        },


        /* NON-VEG - SNACKS / FAST FOOD */

        {
            name: "Egg Roll",
            price: 55,
            category: "Fast Food",
            type: "Non-Veg",
            icon: "🌯",
            available: true
        },

        {
            name: "Egg Sandwich",
            price: 60,
            category: "Fast Food",
            type: "Non-Veg",
            icon: "🥪",
            available: true
        }

    ];


    let currentType = "All";
    let currentCategory = "All";
        
    /* ============================
       SERVICE CHARGE
       ============================ */

    function getServiceCharge(price) {
        return price <= 20 ? 0.50 : 1.00;
    }

    function getItemTotal(price, quantity) {
        return (price * quantity) + (getServiceCharge(price) * quantity);
    }


    /* ============================
       ESCAPE HTML
       ============================ */

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* ============================
       FOOD TYPE
       ============================ */

    function selectFoodType(type) {

        currentType = type;

        document.querySelectorAll(".food-type-btn").forEach(button => {
            button.classList.remove("active");

            if (button.dataset.type === type) {
                button.classList.add("active");
            }
        });

        renderMenu();
    }


    /* ============================
       CATEGORY FILTER
       ============================ */

    function filterMenu(category, button) {

        currentCategory = category;

        document.querySelectorAll(".category-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        if (button) {
            button.classList.add("active");
        }

        renderMenu();
    }


    /* ============================
       CHECK AVAILABILITY
       ============================ */

    function isItemAvailable(item) {

        const unavailableItems =
            JSON.parse(
                localStorage.getItem("nextTurnUnavailableItems") || "[]"
            );

        return item.available &&
               !unavailableItems.includes(item.name);
    }


    /* ============================
       RENDER MENU
       ============================ */

    function renderMenu() {

        const menuGrid = document.getElementById("menuGrid");

        if (!menuGrid) return;

        let filteredMenu = menu.filter(item => {

            const typeMatch =
                currentType === "All" ||
                item.type === currentType;

            const categoryMatch =
                currentCategory === "All" ||
                item.category === currentCategory;

            return typeMatch && categoryMatch;
        });


        if (filteredMenu.length === 0) {

            menuGrid.innerHTML = `
                <div class="empty-menu">
                    <h3>No food available</h3>
                    <p>
                        There are no items in this section right now.
                    </p>
                </div>
            `;

            return;
        }


        menuGrid.innerHTML = filteredMenu.map(item => {

            const available = isItemAvailable(item);

            const serviceCharge =
                getServiceCharge(item.price);

            return `
                <div class="food-card ${available ? "" : "unavailable"}">

                    <div>

                        <div class="food-icon">
                            ${item.icon}
                        </div>

                        <div class="food-type-label">
                            ${escapeHTML(item.type)}
                        </div>

                        <h3 class="food-name">
                            ${escapeHTML(item.name)}
                        </h3>

                        <p class="food-category">
                            ${escapeHTML(item.category)}
                        </p>

                    </div>


                    <div class="food-bottom">

                        <div>
                            <div class="food-price">
                                ₹${item.price.toFixed(2)}
                            </div>

                            <small style="
                                color:#777;
                                font-size:10px;
                                display:block;
                                margin-top:3px;
                            ">
                                + ₹${serviceCharge.toFixed(2)} service
                            </small>
                        </div>


                        ${
                            available
                            ?
                            `
                            <button
                                class="add-food-btn"
                                onclick='addToCart(${JSON.stringify(item.name)})'>
                                + Add
                            </button>
                            `
                            :
                            `
                            <button
                                class="add-food-btn"
                                disabled>
                                Unavailable
                            </button>
                            `
                        }

                    </div>

                </div>
            `;

        }).join("");
    }


    /* ============================
       CART
       ============================ */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem("nextTurnCart") || "[]"
            );

        } catch (error) {

            return [];

        }
    }


    function saveCart(cart) {

        localStorage.setItem(
            "nextTurnCart",
            JSON.stringify(cart)
        );

    }


    /* ============================
       ADD TO CART
       ============================ */

    function addToCart(itemName) {

        const item =
            menu.find(food => food.name === itemName);

        if (!item) return;

        if (!isItemAvailable(item)) {

            alert(
                `${item.name} is currently unavailable.`
            );

            return;
        }


        const cart = getCart();

        const existingItem =
            cart.find(food => food.name === item.name);


        if (existingItem) {

            existingItem.quantity =
                Number(existingItem.quantity || 0) + 1;

        } else {

            cart.push({

                name: item.name,

                price: item.price,

                quantity: 1,

                category: item.category,

                type: item.type,

                serviceCharge:
                    getServiceCharge(item.price)

            });

        }


        saveCart(cart);

        updateCartUI();

        // Small confirmation
        const button =
            [...document.querySelectorAll(".add-food-btn")]
                .find(btn =>
                    btn.getAttribute("onclick") &&
                    btn.getAttribute("onclick")
                        .includes(item.name)
                );

        if (button) {

            const originalText =
                button.textContent;

            button.textContent = "✓ Added";

            setTimeout(() => {

                if (button) {
                    button.textContent = originalText;
                }

            }, 700);

        }

    }


    /* ============================
       CART TOTAL
       ============================ */

    function calculateCartTotal(cart) {

        let total = 0;

        cart.forEach(item => {

            const price =
                Number(item.price || 0);

            const quantity =
                Number(item.quantity || 0);

            const serviceCharge =
                price <= 20 ? 0.50 : 1.00;

            total +=
                (price + serviceCharge) * quantity;

        });

        return total;

    }


    /* ============================
       UPDATE CART UI
       ============================ */

    function updateCartUI() {

        const cart = getCart();

        let itemCount = 0;

        cart.forEach(item => {

            itemCount +=
                Number(item.quantity || 0);

        });


        const total =
            calculateCartTotal(cart);


        const badge =
            document.getElementById("cartBadge");

        const cartText =
            document.getElementById("cartText");

        const cartTotal =
            document.getElementById("cartTotal");


        if (badge) {

            badge.textContent =
                itemCount;

        }


        if (cartText) {

            cartText.textContent =
                `(${itemCount} ${
                    itemCount === 1
                    ? "item"
                    : "items"
                })`;

        }


        if (cartTotal) {

            cartTotal.textContent =
                `₹${total.toFixed(2)}`;

        }

    }


    /* ============================
       NAVIGATION
       ============================ */

    function goToCart() {

        window.location.href =
            "cart.html";

    }


    function goToDashboard() {

        window.location.href =
            "student.html";

    }


    /* ============================
       LOAD SELECTED FOOD TYPE
       ============================ */

    function loadSelectedType() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const urlType =
            params.get("type");


        const savedType =
            localStorage.getItem(
                "nextTurnFoodType"
            );


        let selectedType = "All";


        if (
            urlType === "Veg" ||
            urlType === "Non-Veg"
        ) {

            selectedType = urlType;

        } else if (
            savedType === "Veg" ||
            savedType === "Non-Veg"
        ) {

            selectedType = savedType;

        }


        currentType =
            selectedType;


        document
            .querySelectorAll(".food-type-btn")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.type === selectedType
                );

            });

    }


    /* ============================
       STORAGE SYNC
       ============================ */

    window.addEventListener(
        "storage",
        function(event) {

            if (
                event.key === "nextTurnCart" ||
                event.key === "nextTurnUnavailableItems"
            ) {

                renderMenu();

                updateCartUI();

            }

        }
    );


    /* ============================
       INITIALIZE
       ============================ */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadSelectedType();

            renderMenu();

            updateCartUI();

        }
    );

</script>

</body>
</html>
