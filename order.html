<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextTurn | Order</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .order-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 130px;
        }

        .order-hero {
            background:
                radial-gradient(circle at top right, rgba(212,175,55,.18), transparent 35%),
                linear-gradient(135deg, #111111, #080808);
            border: 1px solid rgba(212,175,55,.25);
            border-radius: 24px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 15px 45px rgba(0,0,0,.35);
        }

        .order-hero h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 42px);
            color: #f5f5f5;
        }

        .order-hero p {
            margin: 0;
            color: #9a9a9a;
            font-size: 15px;
        }

        .gold-text {
            color: #d4af37;
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 2px 18px;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            flex: 0 0 auto;
            border: 1px solid rgba(212,175,55,.25);
            background: #111;
            color: #cfcfcf;
            padding: 11px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: .2s ease;
            font-weight: 600;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #d4af37;
            color: #080808;
            border-color: #d4af37;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .food-card {
            position: relative;
            background: #111;
            border: 1px solid rgba(212,175,55,.16);
            border-radius: 20px;
            padding: 20px;
            min-height: 215px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .2s ease, border-color .2s ease,
                        box-shadow .2s ease;
        }

        .food-card:hover {
            transform: translateY(-3px);
            border-color: rgba(212,175,55,.55);
            box-shadow: 0 12px 35px rgba(0,0,0,.35);
        }

        .food-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(212,175,55,.09);
            border: 1px solid rgba(212,175,55,.2);
            font-size: 28px;
            margin-bottom: 15px;
        }

        .food-name {
            color: #f5f5f5;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .food-category {
            color: #8d8d8d;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .food-price {
            color: #f4d77d;
            font-size: 20px;
            font-weight: 800;
        }

        .food-service {
            color: #777;
            font-size: 11px;
            margin-top: 3px;
        }

        .add-btn {
            width: 100%;
            margin-top: 16px;
            border: 1px solid #d4af37;
            background: transparent;
            color: #f4d77d;
            padding: 11px 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s ease;
        }

        .add-btn:hover {
            background: #d4af37;
            color: #080808;
        }

        .add-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            border-color: #555;
            color: #777;
        }

        .stock-label {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: #777;
        }

        .floating-cart {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            width: min(560px, calc(100% - 30px));
            background: rgba(17,17,17,.96);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(212,175,55,.4);
            border-radius: 18px;
            padding: 12px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 999;
            box-shadow: 0 15px 50px rgba(0,0,0,.6);
        }

        .floating-cart.show {
            display: flex;
        }

        .cart-info {
            min-width: 0;
        }

        .cart-info strong {
            display: block;
            color: #f5f5f5;
            font-size: 14px;
        }

        .cart-info span {
            color: #999;
            font-size: 12px;
        }

        .view-cart-btn {
            flex: 0 0 auto;
            background: #d4af37;
            color: #080808;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 800;
            cursor: pointer;
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #888;
            grid-column: 1 / -1;
        }

        @media (max-width: 1050px) {
            .food-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .order-page {
                padding: 20px 14px 120px;
            }

            .order-hero {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .food-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .food-card {
                padding: 15px;
                min-height: 205px;
            }

            .food-icon {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }

            .food-name {
                font-size: 16px;
            }

            .food-price {
                font-size: 18px;
            }
        }

        @media (max-width: 470px) {
            .food-grid {
                grid-template-columns: 1fr;
            }

            .floating-cart {
                bottom: 12px;
                width: calc(100% - 20px);
            }

            .view-cart-btn {
                padding: 11px 14px;
            }
        }
    </style>
</head>

<body>

    <header class="top-header">
        <div class="header-inner">
            <div class="brand">
                <span class="brand-mark">N</span>
                <span>NextTurn</span>
            </div>

            <div class="header-actions">
                <button class="header-btn" onclick="goTo('student.html')">
                    Dashboard
                </button>

                <button class="header-btn" onclick="goTo('cart.html')">
                    Cart
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="order-page">

        <section class="order-hero">
            <h1>Order <span class="gold-text">Fresh.</span></h1>
            <p>
                Choose your favourites, add them to your cart,
                and skip the canteen queue.
            </p>
        </section>

        <nav class="category-bar" id="categoryBar">
            <button class="category-btn active"
                    onclick="filterMenu('All', this)">
                All
            </button>

            <button class="category-btn"
                    onclick="filterMenu('Snacks', this)">
                Snacks
            </button>

            <button class="category-btn"
                    onclick="filterMenu('Fast Food', this)">
                Fast Food
            </button>

            <button class="category-btn"
                    onclick="filterMenu('Meals', this)">
                Meals
            </button>

            <button class="category-btn"
                    onclick="filterMenu('Drinks', this)">
                Drinks
            </button>
        </nav>

        <section class="food-grid" id="foodGrid"></section>

    </main>

    <div class="floating-cart" id="floatingCart">
        <div class="cart-info">
            <strong id="floatingCartItems">0 items</strong>
            <span id="floatingCartTotal">₹0</span>
        </div>

        <button class="view-cart-btn" onclick="goTo('cart.html')">
            View Cart →
        </button>
    </div>
        <script>
        const menu = [
            { name: "Chips", price: 10, category: "Snacks", icon: "🍟", available: true },
            { name: "Kurkure", price: 10, category: "Snacks", icon: "🌶️", available: true },
            { name: "Samosa", price: 15, category: "Snacks", icon: "🥟", available: true },
            { name: "Vada Pav", price: 20, category: "Snacks", icon: "🍔", available: true },

            { name: "Veg Sandwich", price: 40, category: "Fast Food", icon: "🥪", available: true },
            { name: "Cheese Sandwich", price: 50, category: "Fast Food", icon: "🧀", available: true },
            { name: "Veg Burger", price: 60, category: "Fast Food", icon: "🍔", available: true },
            { name: "French Fries", price: 50, category: "Fast Food", icon: "🍟", available: true },
            { name: "Veg Roll", price: 45, category: "Fast Food", icon: "🌯", available: true },

            { name: "Veg Biryani", price: 80, category: "Meals", icon: "🍚", available: true },
            { name: "Veg Thali", price: 90, category: "Meals", icon: "🍛", available: true },
            { name: "Misal Pav", price: 45, category: "Meals", icon: "🍲", available: true },

            { name: "Frooti", price: 20, category: "Drinks", icon: "🧃", available: true },
            { name: "Masala Chai", price: 15, category: "Drinks", icon: "☕", available: true },
            { name: "Cold Coffee", price: 40, category: "Drinks", icon: "🥤", available: true },
            { name: "Lemon Juice", price: 25, category: "Drinks", icon: "🍋", available: true },
            { name: "Soft Drink", price: 30, category: "Drinks", icon: "🥤", available: true }
        ];

        let currentCategory = "All";

        function getServiceCharge(price) {
            return price <= 20 ? 0.50 : 1.00;
        }

        function getItemTotal(price, quantity) {
            return (price * quantity) +
                   (getServiceCharge(price) * quantity);
        }

        function escapeHTML(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getUnavailableItems() {
            try {
                return JSON.parse(
                    localStorage.getItem("nextTurnUnavailableItems") || "[]"
                );
            } catch {
                return [];
            }
        }

        function getCart() {
            try {
                return JSON.parse(
                    localStorage.getItem("nextTurnCart") || "[]"
                );
            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(
                "nextTurnCart",
                JSON.stringify(cart)
            );

            updateCartUI();
        }

        function renderMenu() {
            const grid = document.getElementById("foodGrid");
            const unavailable = getUnavailableItems();

            const filtered = currentCategory === "All"
                ? menu
                : menu.filter(item =>
                    item.category === currentCategory
                );

            if (!filtered.length) {
                grid.innerHTML = `
                    <div class="empty-state">
                        No items available in this category.
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map((item, index) => {
                const isUnavailable =
                    !item.available ||
                    unavailable.includes(item.name);

                return `
                    <article class="food-card">

                        <div>
                            <div class="food-icon">
                                ${item.icon}
                            </div>

                            <div class="food-name">
                                ${escapeHTML(item.name)}
                            </div>

                            <div class="food-category">
                                ${escapeHTML(item.category)}
                            </div>

                            <div class="food-price">
                                ₹${item.price}
                            </div>

                            <div class="food-service">
                                + ₹${getServiceCharge(item.price).toFixed(2)}
                                service charge
                            </div>
                        </div>

                        <div>
                            <button
                                class="add-btn"
                                onclick="addToCart(${index}, '${escapeHTML(item.name)}')"
                                ${isUnavailable ? "disabled" : ""}
                            >
                                ${isUnavailable ? "Unavailable" : "Add to Cart"}
                            </button>

                            ${
                                isUnavailable
                                    ? `<span class="stock-label">Currently unavailable</span>`
                                    : ""
                            }
                        </div>

                    </article>
                `;
            }).join("");
        }

        function filterMenu(category, button) {
            currentCategory = category;

            document
                .querySelectorAll(".category-btn")
                .forEach(btn => btn.classList.remove("active"));

            if (button) {
                button.classList.add("active");
            }

            renderMenu();
        }

        function addToCart(index, itemName) {
            const item = menu.find(
                food => food.name === itemName
            );

            if (!item) return;

            const unavailable = getUnavailableItems();

            if (
                !item.available ||
                unavailable.includes(item.name)
            ) {
                alert("This item is currently unavailable.");
                return;
            }

            const cart = getCart();

            const existing = cart.find(
                cartItem => cartItem.name === item.name
            );

            if (existing) {
                existing.quantity =
                    Number(existing.quantity || 0) + 1;
            } else {
                cart.push({
                    name: item.name,
                    price: item.price,
                    category: item.category,
                    quantity: 1,
                    serviceCharge: getServiceCharge(item.price)
                });
            }

            saveCart(cart);

            showAddedFeedback(item.name);
        }

        function showAddedFeedback(name) {
            const floating = document.getElementById("floatingCart");

            floating.classList.add("show");

            setTimeout(() => {
                floating.classList.add("show");
            }, 50);
        }

        function updateCartUI() {
            const cart = getCart();

            const itemCount = cart.reduce(
                (total, item) =>
                    total + Number(item.quantity || 0),
                0
            );

            const cartTotal = cart.reduce(
                (total, item) =>
                    total +
                    getItemTotal(
                        Number(item.price),
                        Number(item.quantity)
                    ),
                0
            );

            const badge = document.getElementById("cartCount");

            if (badge) {
                badge.textContent = itemCount;
                badge.style.display =
                    itemCount > 0 ? "inline-flex" : "none";
            }

            const floating =
                document.getElementById("floatingCart");

            const floatingItems =
                document.getElementById("floatingCartItems");

            const floatingTotal =
                document.getElementById("floatingCartTotal");

            if (itemCount > 0) {
                floating.classList.add("show");

                floatingItems.textContent =
                    `${itemCount} ${itemCount === 1 ? "item" : "items"}`;

                floatingTotal.textContent =
                    `₹${cartTotal.toFixed(2)}`;
            } else {
                floating.classList.remove("show");

                floatingItems.textContent = "0 items";
                floatingTotal.textContent = "₹0";
            }
        }

        function goTo(page) {
            window.location.href = page;
        }

        window.addEventListener("storage", () => {
            updateCartUI();
            renderMenu();
        });

        document.addEventListener("DOMContentLoaded", () => {
            renderMenu();
            updateCartUI();
        });
    </script>

</body>
</html>
