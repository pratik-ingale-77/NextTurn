<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NextTurn | Order Food</title>

<link rel="stylesheet" href="styles.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#080808;
    color:#f5f5f5;
    font-family:Arial,sans-serif;
}

.top-header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,8,8,.96);
    border-bottom:1px solid rgba(212,175,55,.18);
    backdrop-filter:blur(12px);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    font-size:25px;
    font-weight:900;
    color:#d4af37;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:1px solid rgba(212,175,55,.3);
    background:#111;
    color:#d4af37;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
    font-weight:700;
}

.page{
    max-width:1200px;
    margin:auto;
    padding:28px 18px 100px;
}

.hero{
    background:linear-gradient(135deg,#151515,#090909);
    border:1px solid rgba(212,175,55,.2);
    border-radius:22px;
    padding:28px;
    margin-bottom:22px;
}

.eyebrow{
    color:#d4af37;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
}

.hero h1{
    margin:8px 0;
    font-size:clamp(30px,5vw,45px);
}

.hero h1 span{
    color:#d4af37;
}

.hero p{
    color:#999;
    margin:0;
    line-height:1.6;
}

.filters{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding-bottom:5px;
    margin-bottom:15px;
}

.filter{
    flex:0 0 auto;
    border:1px solid rgba(212,175,55,.25);
    background:#111;
    color:#aaa;
    padding:10px 15px;
    border-radius:30px;
    cursor:pointer;
    font-weight:700;
}

.filter.active{
    background:#d4af37;
    color:#080808;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.food-card{
    background:#111;
    border:1px solid rgba(212,175,55,.14);
    border-radius:18px;
    padding:18px;
    transition:.2s;
}

.food-card:hover{
    border-color:rgba(212,175,55,.4);
    transform:translateY(-2px);
}

.food-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.food-icon{
    font-size:28px;
    margin-bottom:8px;
}

.food-name{
    font-size:17px;
    font-weight:900;
}

.food-category{
    color:#777;
    font-size:12px;
    margin:6px 0;
}

.price{
    color:#f4d77d;
    font-size:17px;
    font-weight:900;
}

.flavor-count{
    color:#d4af37;
    font-size:11px;
    font-weight:800;
    margin:10px 0;
}

.unavailable{
    color:#e57373;
    font-size:11px;
    font-weight:900;
    margin:12px 0;
}

.add-btn{
    width:100%;
    margin-top:15px;
    border:0;
    border-radius:11px;
    padding:12px;
    background:#d4af37;
    color:#080808;
    font-weight:900;
    cursor:pointer;
}

.add-btn:disabled{
    background:#292929;
    color:#777;
    cursor:not-allowed;
}

.cart-float{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:90;
    background:#d4af37;
    color:#080808;
    border:0;
    border-radius:50px;
    padding:14px 20px;
    font-weight:900;
    box-shadow:0 10px 35px rgba(0,0,0,.5);
    cursor:pointer;
}

.flavor-modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:18px;
}

.flavor-box{
    width:min(100%,430px);
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid rgba(212,175,55,.4);
    border-radius:22px;
    padding:22px;
}

.flavor-box h2{
    margin:0;
}

.flavor-subtitle{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.flavor-list{
    display:grid;
    gap:10px;
    margin-top:18px;
}

.flavor-option{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(212,175,55,.2);
    background:#090909;
    color:#f5f5f5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-align:left;
    cursor:pointer;
}

.flavor-option:hover{
    border-color:#d4af37;
}

.flavor-option.unavailable{
    opacity:.45;
    cursor:not-allowed;
}

.flavor-price{
    color:#f4d77d;
    font-weight:800;
    font-size:13px;
}

.flavor-status{
    color:#e57373;
    font-size:10px;
    font-weight:900;
}

.close-btn{
    width:100%;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:#181818;
    border:1px solid rgba(212,175,55,.3);
    color:#d4af37;
    font-weight:800;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#777;
}

@media(max-width:900px){
    .menu-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .page{
        padding:20px 13px 100px;
    }

    .hero{
        padding:22px;
    }

    .menu-grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        padding:13px;
    }

    .brand{
        font-size:21px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:11px;
    }
}
</style>
</head>

<body>

<header class="top-header">
    <div class="header-inner">

        <div class="brand">NextTurn</div>

        <div class="header-actions">

            <button class="header-btn"
                    onclick="window.location.href='student.html'">
                Dashboard
            </button>

            <button class="header-btn"
                    onclick="window.location.href='cart.html'">
                Cart
            </button>

        </div>

    </div>
</header>

<main class="page">

<section class="hero">

    <div class="eyebrow">
        NextTurn Canteen
    </div>

    <h1>
        Order <span>Food.</span>
    </h1>

    <p>
        Choose your food and select a flavor where available.
        Your selected flavor will be preserved in your cart.
    </p>

</section>


<div class="filters" id="typeFilters">

    <button class="filter active"
            onclick="setType('All',this)">
        All
    </button>

    <button class="filter"
            onclick="setType('Veg',this)">
        🟢 Veg
    </button>

    <button class="filter"
            onclick="setType('Non-Veg',this)">
        🔴 Non-Veg
    </button>

</div>


<div class="filters" id="categoryFilters">

    <button class="filter active"
            onclick="setCategory('All',this)">
        All
    </button>

    <button class="filter"
            onclick="setCategory('Snacks',this)">
        Snacks
    </button>

    <button class="filter"
            onclick="setCategory('Fast Food',this)">
        Fast Food
    </button>

    <button class="filter"
            onclick="setCategory('Meals',this)">
        Meals
    </button>

    <button class="filter"
            onclick="setCategory('Drinks',this)">
        Drinks
    </button>

</div>


<div id="menuGrid" class="menu-grid"></div>

</main>


<div id="flavorModal"
     class="flavor-modal"
     onclick="closeFlavorPicker(event)">

    <div class="flavor-box"
         onclick="event.stopPropagation()">

        <h2 id="flavorTitle">
            Choose Flavor
        </h2>

        <div class="flavor-subtitle">
            Select exactly one flavor
        </div>

        <div id="flavorList"
             class="flavor-list">
        </div>

        <button class="close-btn"
                onclick="closeFlavorPicker()">
            Close
        </button>

    </div>

</div>


<button class="cart-float"
        onclick="window.location.href='cart.html'">

    🛒 Cart
    <span id="cartCount">0</span>

</button>


<script>

const API =
    "https://nextturn-mgbf.onrender.com";


const menu = [

    {
        name:"Chips",
        category:"Snacks",
        price:10,
        type:"Veg"
    },

    {
        name:"Kurkure",
        category:"Snacks",
        price:10,
        type:"Veg"
    },

    {
        name:"Samosa",
        category:"Snacks",
        price:15,
        type:"Veg"
    },

    {
        name:"Vada Pav",
        category:"Snacks",
        price:20,
        type:"Veg"
    },

    {
        name:"Veg Sandwich",
        category:"Fast Food",
        price:40,
        type:"Veg"
    },

    {
        name:"Cheese Sandwich",
        category:"Fast Food",
        price:50,
        type:"Veg"
    },

    {
        name:"Veg Burger",
        category:"Fast Food",
        price:60,
        type:"Veg"
    },

    {
        name:"French Fries",
        category:"Fast Food",
        price:50,
        type:"Veg"
    },

    {
        name:"Veg Roll",
        category:"Fast Food",
        price:45,
        type:"Veg"
    },

    {
        name:"Veg Biryani",
        category:"Meals",
        price:80,
        type:"Veg"
    },

    {
        name:"Veg Thali",
        category:"Meals",
        price:90,
        type:"Veg"
    },

    {
        name:"Misal Pav",
        category:"Meals",
        price:45,
        type:"Veg"
    },

    {
        name:"Frooti",
        category:"Drinks",
        price:20,
        type:"Veg"
    },

    {
        name:"Masala Chai",
        category:"Drinks",
        price:15,
        type:"Veg"
    },

    {
        name:"Cold Coffee",
        category:"Drinks",
        price:40,
        type:"Veg"
    },

    {
        name:"Lemon Juice",
        category:"Drinks",
        price:25,
        type:"Veg"
    },

    {
        name:"Soft Drink",
        category:"Drinks",
        price:30,
        type:"Veg"
    },

    {
        name:"Chicken Sandwich",
        category:"Fast Food",
        price:70,
        type:"Non-Veg"
    },

    {
        name:"Chicken Burger",
        category:"Fast Food",
        price:90,
        type:"Non-Veg"
    },

    {
        name:"Chicken Roll",
        category:"Fast Food",
        price:80,
        type:"Non-Veg"
    },

    {
        name:"Chicken Biryani",
        category:"Meals",
        price:120,
        type:"Non-Veg"
    },

    {
        name:"Chicken Thali",
        category:"Meals",
        price:130,
        type:"Non-Veg"
    },

    {
        name:"Egg Roll",
        category:"Fast Food",
        price:55,
        type:"Non-Veg"
    },

    {
        name:"Egg Sandwich",
        category:"Fast Food",
        price:60,
        type:"Non-Veg"
    }

];


let currentType = "All";
let currentCategory = "All";

let flavorData = {};


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function getServiceCharge(price){

    return Number(price) <= 20
        ? 0.50
        : 1.00;

}


function getCart(){

    try{

        const cart =
            JSON.parse(
                localStorage.getItem("nextTurnCart") || "[]"
            );

        return Array.isArray(cart) ? cart : [];

    }catch{

        return [];

    }

}


function saveCart(cart){

    localStorage.setItem(
        "nextTurnCart",
        JSON.stringify(cart)
    );

}


function updateCartUI(){

    const cart = getCart();

    const count =
        cart.reduce(
            (sum,item)=>
                sum + Number(item.quantity || 1),
            0
        );

    document.getElementById("cartCount")
        .textContent = count;

}


function setType(type,button){

    currentType = type;

    document
        .querySelectorAll("#typeFilters .filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderMenu();

}


function setCategory(category,button){

    currentCategory = category;

    document
        .querySelectorAll("#categoryFilters .filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    button.classList.add("active");

    renderMenu();

}


async function syncFoodAvailability(){

    try{

        const response =
            await fetch(
                `${API}/api/staff/food?t=${Date.now()}`,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error("Food API failed");
        }

        const backendFood =
            await response.json();

        flavorData = {};

        backendFood.forEach(food => {

            const name =
                String(
                    food.name ||
                    food.foodName ||
                    ""
                ).trim();

            const flavor =
                String(
                    food.flavor ||
                    ""
                ).trim();

            if(flavor){

                if(!flavorData[name]){
                    flavorData[name] = [];
                }

                flavorData[name].push({

                    id:food.id,

                    flavor:flavor,

                    price:Number(
                        food.price || 0
                    ),

                    available:
                        food.available === true ||
                        food.available === "true" ||
                        food.available === 1

                });

            }

        });


        menu.forEach(item => {

            const backendItem =
                backendFood.find(food => {

                    const name =
                        String(
                            food.name ||
                            food.foodName ||
                            ""
                        ).trim()
                        .toLowerCase();

                    return (
                        name ===
                        item.name.toLowerCase()
                    ) &&
                    !String(food.flavor || "").trim();

                });


            if(backendItem){

                item.available =
                    backendItem.available === true ||
                    backendItem.available === "true" ||
                    backendItem.available === 1;

            }


            if(flavorData[item.name]){

                item.available =
                    flavorData[item.name]
                        .some(
                            flavor =>
                                flavor.available
                        );

            }

        });


        renderMenu();

    }catch(error){

        console.error(
            "Availability sync error:",
            error
        );

        renderMenu();

    }

}


function renderMenu(){

    const container =
        document.getElementById("menuGrid");


    const filtered =
        menu.filter(item => {

            const typeMatch =
                currentType === "All" ||
                item.type === currentType;

            const categoryMatch =
                currentCategory === "All" ||
                item.category === currentCategory;

            return typeMatch &&
                   categoryMatch;

        });


    if(!filtered.length){

        container.innerHTML = `
            <div class="empty">
                No food items found.
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered.map(item => {

            const available =
                item.available !== false;

            const hasFlavors =
                item.name === "Chips" ||
                item.name === "Kurkure";

            const availableFlavors =
                flavorData[item.name]
                ? flavorData[item.name]
                    .filter(f => f.available)
                : [];


            let actionButton;


            if(hasFlavors){

                actionButton = available

                    ? `
                        <button
                            class="add-btn"
                            onclick='openFlavorPicker(${JSON.stringify(item.name)})'>
                            Choose Flavor
                        </button>
                      `

                    : `
                        <button
                            class="add-btn"
                            disabled>
                            Unavailable
                        </button>
                      `;

            }else{

                actionButton = available

                    ? `
                        <button
                            class="add-btn"
                            onclick='addToCart(${JSON.stringify(item.name)})'>
                            + Add to Cart
                        </button>
                      `

                    : `
                        <button
                            class="add-btn"
                            disabled>
                            Unavailable
                        </button>
                      `;

            }


            return `

                <div class="food-card">

                    <div class="food-top">

                        <div>

                            <div class="food-icon">
                                🍽️
                            </div>

                            <div class="food-name">
                                ${escapeHTML(item.name)}
                            </div>

                            <div class="food-category">
                                ${escapeHTML(item.category)}
                            </div>

                        </div>

                        <div class="price">
                            ₹${Number(item.price).toFixed(2)}
                        </div>

                    </div>


                    ${
                        hasFlavors
                        ? `
                            <div class="flavor-count">
                                ${availableFlavors.length}
                                flavor${availableFlavors.length === 1 ? "" : "s"}
                                available
                            </div>
                          `
                        : ""
                    }


                    ${
                        !available
                        ? `
                            <div class="unavailable">
                                NOT AVAILABLE
                            </div>
                          `
                        : ""
                    }


                    ${actionButton}

                </div>

            `;

        }).join("");

}
function addToCart(itemName){

    const item =
        menu.find(
            food => food.name === itemName
        );

    if(!item || item.available === false){
        return;
    }

    const cart = getCart();

    const existing =
        cart.find(food =>
            food.name === item.name &&
            !food.flavor
        );

    if(existing){

        existing.quantity =
            Number(existing.quantity || 0) + 1;

    }else{

        cart.push({

            name:item.name,

            flavor:null,

            price:Number(item.price),

            quantity:1,

            category:item.category,

            type:item.type,

            serviceCharge:
                getServiceCharge(item.price)

        });

    }

    saveCart(cart);

    updateCartUI();

}


function openFlavorPicker(foodName){

    const modal =
        document.getElementById("flavorModal");

    const title =
        document.getElementById("flavorTitle");

    const list =
        document.getElementById("flavorList");

    const flavors =
        flavorData[foodName] || [];

    title.textContent =
        `${foodName} — Choose Flavor`;

    if(!flavors.length){

        list.innerHTML = `
            <div class="empty">
                No flavors found.
            </div>
        `;

    }else{

        list.innerHTML =
            flavors.map(flavor => {

                const available =
                    flavor.available;

                return `

                    <button
                        class="flavor-option ${
                            available
                            ? ""
                            : "unavailable"
                        }"

                        ${
                            available
                            ? `onclick='addFlavorToCart(
                                ${JSON.stringify(foodName)},
                                ${JSON.stringify(flavor.flavor)}
                               )'`
                            : "disabled"
                        }>

                        <span>

                            <strong>
                                ${escapeHTML(flavor.flavor)}
                            </strong>

                            <span
                                style="
                                    display:block;
                                    color:#888;
                                    font-size:11px;
                                    margin-top:4px;
                                ">

                                ${
                                    available
                                    ? "Available"
                                    : "Currently unavailable"
                                }

                            </span>

                        </span>

                        <span>

                            ${
                                available
                                ? `
                                    <span class="flavor-price">
                                        ₹${flavor.price.toFixed(2)}
                                    </span>
                                  `
                                : `
                                    <span class="flavor-status">
                                        UNAVAILABLE
                                    </span>
                                  `
                            }

                        </span>

                    </button>

                `;

            }).join("");

    }

    modal.style.display = "flex";

}


function closeFlavorPicker(event){

    if(
        event &&
        event.target !== event.currentTarget
    ){
        return;
    }

    document.getElementById(
        "flavorModal"
    ).style.display = "none";

}


function addFlavorToCart(
    foodName,
    flavorName
){

    const flavors =
        flavorData[foodName] || [];

    const selected =
        flavors.find(
            flavor =>
                flavor.flavor === flavorName
        );

    if(
        !selected ||
        !selected.available
    ){

        alert(
            `${foodName} - ${flavorName} is currently unavailable.`
        );

        return;

    }

    const baseItem =
        menu.find(
            item =>
                item.name === foodName
        );

    const cart = getCart();


    /*
     * Each flavor is a separate
     * cart item.
     */

    const existing =
        cart.find(item =>
            item.name === foodName &&
            item.flavor === flavorName
        );


    if(existing){

        existing.quantity =
            Number(existing.quantity || 0) + 1;

    }else{

        cart.push({

            name:foodName,

            flavor:flavorName,

            price:Number(selected.price),

            quantity:1,

            category:
                baseItem
                ? baseItem.category
                : "Snacks",

            type:
                baseItem
                ? baseItem.type
                : "Veg",

            serviceCharge:
                getServiceCharge(
                    selected.price
                )

        });

    }


    saveCart(cart);

    updateCartUI();

    closeFlavorPicker();

}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        menu.forEach(
            item =>
                item.available = true
        );

        renderMenu();

        updateCartUI();

        await syncFoodAvailability();

    }
);


setInterval(
    syncFoodAvailability,
    5000
);

</script>

</body>
</html>
