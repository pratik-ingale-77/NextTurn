<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NextTurn | Cart</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: #f5f5f5;
    min-height: 100vh;
}

header {
    border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    padding: 18px 20px;
    position: sticky;
    top: 0;
    background: rgba(8, 8, 8, 0.96);
    z-index: 10;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #d4af37;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.back-btn {
    background: transparent;
    border: 1px solid #d4af37;
    color: #f4d77d;
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px 50px;
}

.page-title {
    font-size: 32px;
    margin-bottom: 8px;
}

.subtitle {
    color: #9a9a9a;
    margin-bottom: 28px;
}

.cart-layout {
    display: grid;
    grid-template-columns: 1fr 350px;
    gap: 25px;
}

.cart-section,
.summary {
    background: #111;
    border: 1px solid rgba(212, 175, 55, 0.18);
    border-radius: 16px;
    padding: 22px;
}

.section-title {
    color: #f4d77d;
    margin-bottom: 20px;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 18px 0;
    border-bottom: 1px solid #222;
}

.cart-item:last-child {
    border-bottom: none;
}

.item-info h3 {
    font-size: 17px;
    margin-bottom: 7px;
}

.item-info p {
    color: #999;
    font-size: 14px;
}

.item-flavor {
    display: inline-block;
    color: #f4d77d;
    border: 1px solid rgba(212, 175, 55, 0.3);
    background: rgba(212, 175, 55, 0.08);
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 12px;
    margin-bottom: 7px;
}

.item-actions {
    display: flex;
    align-items: center;
    gap: 15px;
}

.quantity-control {
    display: flex;
    align-items: center;
    border: 1px solid #333;
    border-radius: 8px;
    overflow: hidden;
}

.quantity-control button {
    width: 34px;
    height: 34px;
    background: #181818;
    color: #f4d77d;
    border: none;
    font-size: 20px;
    cursor: pointer;
}

.quantity-control span {
    width: 35px;
    text-align: center;
}

.item-total {
    color: #f4d77d;
    font-weight: bold;
    min-width: 70px;
    text-align: right;
}

.remove-btn {
    background: transparent;
    border: 1px solid #444;
    color: #aaa;
    padding: 7px 10px;
    border-radius: 7px;
    cursor: pointer;
}

.remove-btn:hover {
    border-color: #d4af37;
    color: #f4d77d;
}

.summary h2 {
    margin-bottom: 20px;
    color: #f4d77d;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    color: #aaa;
}

.summary-row.total {
    border-top: 1px solid #333;
    margin-top: 10px;
    padding-top: 18px;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
}

.summary-row.total span:last-child {
    color: #f4d77d;
}

.payment-btn {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #d4af37, #f4d77d);
    color: #080808;
    font-weight: 800;
    font-size: 16px;
    cursor: pointer;
}

.menu-btn {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border: 1px solid #d4af37;
    border-radius: 10px;
    background: transparent;
    color: #f4d77d;
    font-weight: 700;
    cursor: pointer;
}

.empty-cart {
    text-align: center;
    padding: 50px 20px;
    color: #999;
}

.empty-cart h2 {
    color: #f4d77d;
    margin-bottom: 10px;
}

@media (max-width: 800px) {

    .cart-layout {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .container {
        padding: 22px 14px 40px;
    }

    .page-title {
        font-size: 27px;
    }

    .cart-section,
    .summary {
        padding: 17px;
    }

    .cart-item {
        flex-direction: column;
    }

    .item-actions {
        justify-content: space-between;
        flex-wrap: wrap;
    }

    .item-total {
        text-align: left;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            NextTurn
        </div>

        <button class="back-btn" onclick="goToMenu()">
            ← Menu
        </button>

    </div>

</header>

<div class="container">

    <h1 class="page-title">
        Your Cart
    </h1>

    <p class="subtitle">
        Review your order before payment
    </p>

    <div id="cartContainer">

        <div class="cart-layout">

            <div class="cart-section">

                <h2 class="section-title">
                    Order Items
                </h2>

                <div id="cartItems"></div>

            </div>

            <div class="summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0.00</span>
                </div>

                <div class="summary-row">
                    <span>Service Charge</span>
                    <span id="serviceCharge">₹0.00</span>
                </div>

                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">₹0.00</span>
                </div>

                <button
                    class="payment-btn"
                    onclick="proceedToPayment()"
                >
                    Proceed to Payment
                </button>

                <button
                    class="menu-btn"
                    onclick="goToMenu()"
                >
                    Continue Shopping
                </button>

            </div>

        </div>

    </div>

</div>

<script>

let cart = [];

function loadCart() {

    const savedCart =
        localStorage.getItem("nextTurnCart");

    if (savedCart) {

        try {
            cart = JSON.parse(savedCart);
        } catch (error) {
            cart = [];
        }

    } else {
        cart = [];
    }

    renderCart();
}

function saveCart() {

    localStorage.setItem(
        "nextTurnCart",
        JSON.stringify(cart)
    );
}

function renderCart() {

    const cartItems =
        document.getElementById("cartItems");

    const subtotalElement =
        document.getElementById("subtotal");

    const serviceChargeElement =
        document.getElementById("serviceCharge");

    const totalElement =
        document.getElementById("total");

    if (!cart.length) {

        cartItems.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Add some delicious food to continue.</p>

                <button
                    class="menu-btn"
                    onclick="goToMenu()"
                >
                    Browse Menu
                </button>
            </div>
        `;

        subtotalElement.textContent = "₹0.00";
        serviceChargeElement.textContent = "₹0.00";
        totalElement.textContent = "₹0.00";

        return;
    }

    let subtotal = 0;
    let serviceCharge = 0;

    cartItems.innerHTML = cart.map((item, index) => {

        const foodName = item.name || "";
        const flavor = item.flavor || "";

        const displayName = flavor
            ? `${foodName} - ${flavor}`
            : foodName;

        const itemTotal =
            item.price * item.quantity;

        subtotal += itemTotal;

        serviceCharge +=
            item.price <= 20
                ? 0.5 * item.quantity
                : 1 * item.quantity;

        return `
            <div class="cart-item">

                <div class="item-info">

                    <h3>
                        ${displayName}
                    </h3>

                    ${
                        flavor
                            ? `<div class="item-flavor">
                                ${flavor}
                               </div>`
                            : ""
                    }

                    <p>
                        ₹${item.price} × ${item.quantity}
                    </p>

                </div>

                <div class="item-actions">

                    <div class="quantity-control">

                        <button
                            onclick="decreaseQuantity(${index})"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="increaseQuantity(${index})"
                        >
                            +
                        </button>

                    </div>

                    <div class="item-total">
                        ₹${itemTotal.toFixed(2)}
                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})"
                    >
                        Remove
                    </button>

                </div>

            </div>
        `;

    }).join("");

    const total =
        subtotal + serviceCharge;

    subtotalElement.textContent =
        `₹${subtotal.toFixed(2)}`;

    serviceChargeElement.textContent =
        `₹${serviceCharge.toFixed(2)}`;

    totalElement.textContent =
        `₹${total.toFixed(2)}`;
}
function increaseQuantity(index) {

    cart[index].quantity++;

    saveCart();

    renderCart();
}


function decreaseQuantity(index) {

    if (cart[index].quantity > 1) {

        cart[index].quantity--;

    } else {

        cart.splice(index, 1);
    }

    saveCart();

    renderCart();
}


function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

    renderCart();
}


function goToMenu() {

    window.location.href = "order.html";
}


function proceedToPayment() {

    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;
    }

    window.location.href = "payment.html";
}


document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadCart();

    }
);

</script>

</body>
</html>
